<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="RecorridAPP">
<link rel="manifest" href="manifest.json">
<title>RecorridAPP</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.9.0/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0d1117;color:#e6edf3;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px;overscroll-behavior:none}
#app{height:100vh;overflow:hidden;position:relative;max-width:720px;margin:0 auto}
.view{display:none;position:absolute;top:0;left:0;right:0;bottom:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.view.active{display:block}
.flex-view.active{display:flex;flex-direction:column;overflow:hidden}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 18px;border-radius:8px;border:none;cursor:pointer;font-weight:600;font-size:14px;font-family:inherit;transition:opacity .15s;line-height:1;text-align:center}
.btn:active{opacity:.75}
.btn-primary{background:#f0a500;color:#0d1117}
.btn-ghost{background:transparent;color:#7d8590;border:1px solid #21262d}
.btn-green{background:#3fb950;color:#0d1117}
.btn-full{width:100%}
.card{background:#161b22;border:1px solid #21262d;border-radius:12px;padding:16px}
.lbl{font-size:10px;color:#7d8590;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;display:block}
.pbar{background:#21262d;border-radius:4px;height:5px;overflow:hidden}
.pbar-f{height:100%;border-radius:4px;transition:width .4s}
input,textarea,select{background:#0a0e14;border:1px solid #21262d;border-radius:8px;padding:10px 13px;color:#e6edf3;font-size:13px;font-family:inherit;outline:none;width:100%;display:block}
input:focus,textarea:focus{border-color:#f0a500}
textarea{resize:vertical;min-height:60px}
.chip{display:inline-block;padding:7px 14px;border-radius:20px;font-size:13px;cursor:pointer;border:1px solid transparent;transition:all .15s;user-select:none}
.chip-off{background:#21262d;color:#7d8590}
.chip-on{background:rgba(240,165,0,.12);color:#f0a500;border-color:rgba(240,165,0,.35)}
.zi{padding:10px 12px;cursor:pointer;border-bottom:1px solid #161b22;border-left:3px solid transparent;transition:all .15s}
.zi-active{background:rgba(240,165,0,.08);border-left-color:#f0a500}
.zi-done{border-left-color:#3fb950}
.ic{background:#161b22;border:1px solid #21262d;border-radius:10px;margin-bottom:8px;overflow:hidden;transition:border-color .2s}
.ic-ok{border-color:rgba(63,185,80,.3)}
.ic-nov{border-color:rgba(248,81,73,.35)}
.sbtn{padding:7px 10px;border-radius:6px;border:none;cursor:pointer;font-size:12px;font-weight:700;font-family:inherit;transition:all .15s}
.sbtn-ok{background:rgba(63,185,80,.1);color:#3fb950}
.sbtn-ok.on{background:#3fb950;color:#0d1117}
.sbtn-nov{background:rgba(248,81,73,.1);color:#f85149}
.sbtn-nov.on{background:#f85149;color:#0d1117}
.rbtn{flex:1;padding:9px 4px;border-radius:8px;border:1px solid #21262d;background:transparent;color:#7d8590;font-weight:600;font-size:11px;cursor:pointer;font-family:inherit;transition:all .15s;text-align:center;line-height:1.5}
.rbtn-a.on{border-color:#f0a500;background:rgba(240,165,0,.12);color:#f0a500}
.rbtn-s.on{border-color:#4d9ef7;background:rgba(77,158,247,.12);color:#4d9ef7}
.rbtn-e.on{border-color:#42b96a;background:rgba(66,185,106,.12);color:#42b96a}
.tbtn{flex:1;padding:10px 4px;border-radius:8px;border:1px solid #21262d;background:#161b22;color:#7d8590;font-weight:600;font-size:12px;cursor:pointer;font-family:inherit;transition:all .15s;text-align:center;line-height:1.5}
.tbtn-a.on{border-color:#f0a500;background:rgba(240,165,0,.12);color:#f0a500}
.tbtn-s.on{border-color:#4d9ef7;background:rgba(77,158,247,.12);color:#4d9ef7}
.tbtn-e.on{border-color:#42b96a;background:rgba(66,185,106,.12);color:#42b96a}
.ghdr{padding:8px 12px;font-size:9px;font-weight:700;color:#7d8590;text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid #21262d;cursor:pointer;display:flex;justify-content:space-between;align-items:center;background:#0a0e14;user-select:none}
.ss{flex:1;height:3px;border-radius:2px;transition:background .3s}
.ph-label{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;background:#0a0e14;border:1px dashed #30363d;border-radius:8px;cursor:pointer;font-size:13px;color:#7d8590}
.ph-wrap{position:relative;display:inline-block}
.ph-wrap img{max-width:200px;border-radius:8px;display:block}
.ph-del{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.75);border:none;color:white;border-radius:4px;padding:3px 8px;cursor:pointer;font-size:12px;font-family:inherit}
.empty{text-align:center;padding:48px 20px;color:#7d8590}
.empty i{font-size:40px;display:block;margin-bottom:12px;opacity:.4}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#3fb950;color:#0d1117;padding:10px 20px;border-radius:8px;font-weight:700;font-size:13px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:#21262d;border-radius:4px}
@media print{
  .no-print{display:none!important}
  body{background:white!important;color:#111!important}
  .card{background:white!important;border:1px solid #ddd!important;break-inside:avoid}
  #app{height:auto!important;overflow:visible!important}
  .view{position:static!important;display:block!important;overflow:visible!important}
}
</style>
</head>
<body>
<div id="app">
  <div id="v-home" class="view">
    <div style="padding:20px;max-width:700px;width:100%;margin:0 auto">
      <div style="padding-top:8px;padding-bottom:24px">
        <div class="lbl" style="letter-spacing:2px;margin-bottom:8px">Administración · Propiedad Horizontal</div>
        <div style="font-size:26px;font-weight:800;color:#e6edf3;letter-spacing:-.5px;margin-bottom:2px">RecorridAPP</div>
        <div style="font-size:13px;color:#7d8590" id="home-count"></div>
      </div>
      <div id="home-list"></div>
      <button class="btn btn-ghost btn-full" style="padding:18px;border-style:dashed;border-radius:12px;margin-top:4px" onclick="goCreate()">
        <i class="ti ti-plus" aria-hidden="true"></i> Configurar nuevo conjunto
      </button>
    </div>
  </div>

  <div id="v-create" class="view">
    <div style="padding:20px;max-width:600px;width:100%;margin:0 auto;padding-bottom:40px">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px">
        <button class="btn btn-ghost" style="padding:8px 10px;flex-shrink:0" onclick="goTo('home')"><i class="ti ti-arrow-left" aria-hidden="true"></i></button>
        <div style="flex:1">
          <div class="lbl" id="cs-label">Paso 1 de 3</div>
          <div style="font-size:17px;font-weight:700;color:#e6edf3" id="cs-title">Información básica</div>
        </div>
      </div>
      <div style="display:flex;gap:6px;margin-bottom:24px"><div class="ss" id="sb1"></div><div class="ss" id="sb2"></div><div class="ss" id="sb3"></div></div>
      <div id="create-body"></div>
    </div>
  </div>

  <div id="v-recorrido" class="view flex-view">
    <div id="rec-top" style="background:#161b22;border-bottom:1px solid #21262d;padding:12px 14px;flex-shrink:0"></div>
    <div style="display:flex;flex:1;overflow:hidden">
      <div id="rec-sb" style="width:130px;border-right:1px solid #21262d;overflow-y:auto;flex-shrink:0;background:#0a0e14"></div>
      <div id="rec-items" style="flex:1;overflow-y:auto;padding:12px 14px"></div>
    </div>
  </div>

  <div id="v-reporte" class="view"></div>
  <div id="v-historial" class="view"></div>
</div>
<div class="toast" id="toast"></div>

<script>
// ============================================================
// CONSTANTS
// ============================================================
const RESP = {
  Admon:     {color:'#f0a500',bg:'rgba(240,165,0,.12)',  icon:'ti-building', label:'Administración', cls:'rbtn-a', tcls:'tbtn-a'},
  Seguridad: {color:'#4d9ef7',bg:'rgba(77,158,247,.12)',icon:'ti-shield',   label:'Seguridad',      cls:'rbtn-s', tcls:'tbtn-s'},
  Aseo:      {color:'#42b96a',bg:'rgba(66,185,106,.12)',icon:'ti-leaf',     label:'Aseo',            cls:'rbtn-e', tcls:'tbtn-e'},
};

const ITEMS_DEF = [
  {id:'ilum',     label:'Iluminación',           icon:'ti-bulb'},
  {id:'paredes',  label:'Paredes',               icon:'ti-wall'},
  {id:'cielos',   label:'Cielos / Techo',         icon:'ti-building-arch'},
  {id:'pisos',    label:'Pisos',                 icon:'ti-layout-board'},
  {id:'puertas',  label:'Puertas y accesos',     icon:'ti-door'},
  {id:'escaleras',label:'Escaleras',             icon:'ti-stairs'},
  {id:'barandas', label:'Barandas',              icon:'ti-barrier-block'},
  {id:'gab_e',    label:'Gabinete eléctrico',    icon:'ti-bolt'},
  {id:'gab_ci',   label:'Contra incendio',       icon:'ti-flame'},
  {id:'jardines', label:'Jardines',              icon:'ti-plant'},
  {id:'perimetro',label:'Perímetro',             icon:'ti-lock'},
  {id:'cctv',     label:'Cámaras CCTV',          icon:'ti-camera'},
];

const ZONAS_SUG = [
  'Portería / Recepción','Lobby','Salón comunal','Piscina',
  'Cancha deportiva','Parqueadero cubierto','Parqueadero descubierto',
  'Cuarto de basuras','Zona BBQ','Gimnasio',
  'Juegos infantiles','Sendero peatonal','Cuarto de bombas','Cuarto de acopio',
];

// ============================================================
// INDEXEDDB
// ============================================================
let idb;
async function openDB() {
  return new Promise((res,rej) => {
    const req = indexedDB.open('RecorridAPP',1);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if(!d.objectStoreNames.contains('conjuntos')) d.createObjectStore('conjuntos',{keyPath:'id'});
      if(!d.objectStoreNames.contains('recorridos')) {
        d.createObjectStore('recorridos',{keyPath:'id'}).createIndex('conjuntoId','conjuntoId',{unique:false});
      }
    };
    req.onsuccess = e => { idb=e.target.result; res(idb); };
    req.onerror = () => rej(req.error);
  });
}
const os = (s,m='readonly') => idb.transaction(s,m).objectStore(s);
const dbGet  = (s,k)   => new Promise((r,j)=>{ const q=os(s).get(k);     q.onsuccess=()=>r(q.result); q.onerror=()=>j(q.error); });
const dbAll  = (s)     => new Promise((r,j)=>{ const q=os(s).getAll();    q.onsuccess=()=>r(q.result); q.onerror=()=>j(q.error); });
const dbPut  = (s,o)   => new Promise((r,j)=>{ const q=os(s,'readwrite').put(o); q.onsuccess=()=>r(q.result); q.onerror=()=>j(q.error); });
const dbDel  = (s,k)   => new Promise((r,j)=>{ const q=os(s,'readwrite').delete(k); q.onsuccess=()=>r(q.result); q.onerror=()=>j(q.error); });
const dbIdx  = (s,i,v) => new Promise((r,j)=>{ const q=os(s).index(i).getAll(v); q.onsuccess=()=>r(q.result); q.onerror=()=>j(q.error); });

// ============================================================
// STATE
// ============================================================
const S = {
  conjuntos:[], historial:{},
  recorrido:null, activeConjunto:null, selZone:null, openGroups:new Set(),
  reporteRec:null, histConjunto:null, activeTab:'Admon',
  createStep:1, createForm:mkForm(),
};

function mkForm() {
  return {nombre:'',tipo:'apartamentos',torres:1,pisos:1,zonasComunes:[],items:ITEMS_DEF.map(i=>({...i}))};
}

// ============================================================
// HELPERS
// ============================================================
const uid   = () => `${Date.now()}_${Math.random().toString(36).slice(2,5)}`;
const today = () => new Date().toISOString().split('T')[0];
const fmtD  = iso => { try{return new Date(iso+'T12:00:00').toLocaleDateString('es-CO',{weekday:'short',day:'numeric',month:'short',year:'numeric'});}catch{return iso;} };
const ico   = s => `<i class="ti ${s}" aria-hidden="true"></i>`;
const esc   = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function buildZones(c) {
  const z=[];
  if(c.tipo!=='casas')
    for(let t=1;t<=(c.torres||1);t++)
      for(let p=1;p<=(c.pisos||1);p++)
        z.push({id:`t${t}p${p}`,label:(c.torres||1)>1?`T${t}·P${p}`:`Piso ${p}`,group:(c.torres||1)>1?`Torre ${t}`:'Pisos',type:'piso'});
  (c.zonasComunes||[]).forEach((zc,i)=>z.push({id:`zc${i}`,label:zc,group:'Zonas Comunes',type:'comun'}));
  return z;
}

function initRec(c) {
  const zones=buildZones(c), zd={};
  zones.forEach(z=>{zd[z.id]={};c.items.forEach(it=>{zd[z.id][it.id]={status:null,responsable:null,nota:'',foto:null};});});
  return {id:uid(),conjuntoId:c.id,conjuntoNombre:c.nombre,fecha:today(),inspector:'',zones,zoneData:zd,items:c.items,doneAt:null};
}

function recProg(rec) {
  let done=0,total=0,nov=0;
  rec.zones.forEach(z=>Object.values(rec.zoneData[z.id]||{}).forEach(d=>{total++;if(d.status)done++;if(d.status==='novedad')nov++;}));
  return {done,total,nov,pct:total?Math.round(done/total*100):0};
}
function zoneProg(zd,zid) {
  let done=0,total=0,nov=0;
  Object.values(zd[zid]||{}).forEach(d=>{total++;if(d.status)done++;if(d.status==='novedad')nov++;});
  return {done,total,nov};
}

function showToast(msg) {
  const t=document.getElementById('toast');
  t.textContent=msg; t.style.opacity='1';
  setTimeout(()=>t.style.opacity='0',2200);
}

// ============================================================
// NAVIGATION
// ============================================================
function goTo(view) {
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  const el=document.getElementById('v-'+view);
  if(el){el.classList.add('active');({home:renderHome,create:renderCreate,recorrido:renderRec,reporte:renderReporte,historial:renderHist})[view]?.();}
}

// ============================================================
// HOME
// ============================================================
function renderHome() {
  const c=S.conjuntos;
  document.getElementById('home-count').textContent=`${c.length} conjunto${c.length!==1?'s':''} configurado${c.length!==1?'s':''}`;
  document.getElementById('home-list').innerHTML = c.length===0
    ? `<div class="empty">${ico('ti-building')} Aún no hay conjuntos configurados</div>`
    : c.map(co=>{
        const h=S.historial[co.id]||[], last=h[0];
        return `<div class="card" style="margin-bottom:12px">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px">
            <div>
              <div style="font-size:16px;font-weight:700;color:#e6edf3;margin-bottom:3px">${esc(co.nombre)}</div>
              <div style="font-size:12px;color:#7d8590">
                ${co.tipo==='casas'?'Casas':((co.torres||1)>1?`${co.torres} torres`:`1 torre`)+` · ${co.pisos} pisos`}
                &nbsp;·&nbsp;${(co.zonasComunes||[]).length} zonas &nbsp;·&nbsp; ${(co.items||[]).length} ítems
              </div>
            </div>
            ${last?`<div style="text-align:right;flex-shrink:0;margin-left:12px">
              <div class="lbl" style="margin-bottom:2px">Último</div>
              <div style="font-size:12px;font-weight:700;color:#e6edf3">${fmtD(last.fecha)}</div>
            </div>`:''}
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button class="btn btn-primary" style="flex:1;min-width:130px" onclick="doStartRec('${co.id}')">${ico('ti-player-play')} Iniciar recorrido</button>
            <button class="btn btn-ghost" onclick="doViewHist('${co.id}')">${ico('ti-history')} Historial (${h.length}/10)</button>
            <button class="btn btn-ghost" style="color:#f85149;border-color:rgba(248,81,73,.3)" onclick="doDeleteConjunto('${co.id}')">${ico('ti-trash')}</button>
          </div>
        </div>`;
      }).join('');
}

async function doDeleteConjunto(cid) {
  if(!confirm('¿Eliminar este conjunto y todo su historial? Esta acción no se puede deshacer.')) return;
  await dbDel('conjuntos',cid);
  const recs=await dbIdx('recorridos','conjuntoId',cid);
  await Promise.all(recs.map(r=>dbDel('recorridos',r.id)));
  S.conjuntos=S.conjuntos.filter(c=>c.id!==cid);
  delete S.historial[cid];
  renderHome();
  showToast('Conjunto eliminado');
}

// ============================================================
// CREATE PLANTILLA
// ============================================================
function goCreate() { S.createStep=1; S.createForm=mkForm(); goTo('create'); }

function renderCreate() {
  const f=S.createForm, titles=['Información básica','Zonas comunes','Ítems de verificación'];
  document.getElementById('cs-label').textContent=`Paso ${S.createStep} de 3`;
  document.getElementById('cs-title').textContent=titles[S.createStep-1];
  [1,2,3].forEach(i=>{document.getElementById('sb'+i).style.background=i<=S.createStep?'#f0a500':'#21262d';});
  const body=document.getElementById('create-body');

  if(S.createStep===1) {
    body.innerHTML=`
      <div style="display:flex;flex-direction:column;gap:16px">
        <div><div class="lbl">Nombre del conjunto</div>
          <input id="cf-nom" value="${esc(f.nombre)}" placeholder="Ej: Conjunto Villa del Río" oninput="S.createForm.nombre=this.value.trim()">
        </div>
        <div><div class="lbl">Tipo</div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            ${['apartamentos','casas','mixto'].map(t=>`<span class="chip ${f.tipo===t?'chip-on':'chip-off'}" onclick="cfTipo('${t}')">${t==='apartamentos'?'Apartamentos':t==='casas'?'Casas':'Mixto'}</span>`).join('')}
          </div>
        </div>
        <div id="pisos-blk" style="${f.tipo==='casas'?'display:none':''}">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:10px">
            <div><div class="lbl">Torres / Bloques</div><input type="number" min="1" max="20" value="${f.torres}" oninput="S.createForm.torres=Math.max(1,+this.value||1);cfInfo()"></div>
            <div><div class="lbl">Pisos por torre</div><input type="number" min="1" max="50" value="${f.pisos}" oninput="S.createForm.pisos=Math.max(1,+this.value||1);cfInfo()"></div>
          </div>
          <div id="cf-info" style="background:rgba(240,165,0,.08);border:1px solid rgba(240,165,0,.2);border-radius:8px;padding:10px 13px;font-size:12px;color:#f0a500">
            ${f.torres*f.pisos} zonas de pisos (${f.torres} torre${f.torres>1?'s':''} × ${f.pisos} piso${f.pisos>1?'s':''})
          </div>
        </div>
        <button class="btn btn-primary btn-full" onclick="cfNext1()">Siguiente ${ico('ti-arrow-right')}</button>
      </div>`;
  }
  else if(S.createStep===2) {
    body.innerHTML=`
      <p style="font-size:13px;color:#7d8590;margin-bottom:14px">Selecciona las zonas comunes del conjunto:</p>
      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px">
        ${ZONAS_SUG.map(z=>`<span class="chip ${f.zonasComunes.includes(z)?'chip-on':'chip-off'}" onclick="cfTogZ(${JSON.stringify(z)})">${esc(z)}</span>`).join('')}
      </div>
      <div style="display:flex;gap:8px;margin-bottom:18px">
        <input id="cz-inp" placeholder="Otra zona..." style="flex:1" onkeydown="if(event.key==='Enter')cfAddZ()">
        <button class="btn btn-ghost" style="flex-shrink:0" onclick="cfAddZ()">+ Agregar</button>
      </div>
      ${f.zonasComunes.length>0?`<div style="margin-bottom:18px">
        <div class="lbl">Seleccionadas (${f.zonasComunes.length})</div>
        <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px">
          ${f.zonasComunes.map(z=>`<span class="chip chip-on" onclick="cfTogZ(${JSON.stringify(z)})">× ${esc(z)}</span>`).join('')}
        </div></div>`:''}
      <div style="display:flex;gap:8px">
        <button class="btn btn-ghost" onclick="cfStep(1)">${ico('ti-arrow-left')} Anterior</button>
        <button class="btn btn-primary" style="flex:1" onclick="cfStep(3)" ${f.zonasComunes.length===0?'disabled':''}>Siguiente ${ico('ti-arrow-right')}</button>
      </div>`;
  }
  else {
    body.innerHTML=`
      <p style="font-size:13px;color:#7d8590;margin-bottom:12px">Ítems a verificar en cada zona (${f.items.length} activos):</p>
      <div style="display:flex;flex-direction:column;gap:5px;margin-bottom:12px">
        ${ITEMS_DEF.map(it=>{
          const on=f.items.some(i=>i.id===it.id);
          return `<div onclick="cfTogIt('${it.id}')" style="display:flex;align-items:center;gap:10px;padding:10px 13px;border-radius:8px;cursor:pointer;background:${on?'rgba(240,165,0,.06)':'transparent'};border:1px solid ${on?'rgba(240,165,0,.25)':'#21262d'};transition:all .15s">
            <i class="ti ${it.icon}" style="color:${on?'#f0a500':'#7d8590'};font-size:16px;width:20px;text-align:center" aria-hidden="true"></i>
            <span style="flex:1;font-size:13px;color:${on?'#e6edf3':'#7d8590'}">${it.label}</span>
            <div style="width:18px;height:18px;border-radius:4px;background:${on?'#f0a500':'#21262d'};display:flex;align-items:center;justify-content:center;font-size:11px;color:${on?'#0d1117':'transparent'};flex-shrink:0;font-weight:800">${on?'✓':''}</div>
          </div>`;
        }).join('')}
        ${f.items.filter(i=>!ITEMS_DEF.some(d=>d.id===i.id)).map(it=>`
          <div style="display:flex;align-items:center;gap:10px;padding:10px 13px;border-radius:8px;background:rgba(240,165,0,.06);border:1px solid rgba(240,165,0,.25)">
            ${ico('ti-point')} <span style="flex:1;font-size:13px">${esc(it.label)}</span>
            <span onclick="cfDelIt('${it.id}')" style="color:#f85149;cursor:pointer;font-size:20px;line-height:1">×</span>
          </div>`).join('')}
      </div>
      <div style="display:flex;gap:8px;margin-bottom:18px">
        <input id="ci-inp" placeholder="Ítem personalizado..." style="flex:1" onkeydown="if(event.key==='Enter')cfAddIt()">
        <button class="btn btn-ghost" style="flex-shrink:0" onclick="cfAddIt()">+ Agregar</button>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-ghost" onclick="cfStep(2)">${ico('ti-arrow-left')} Anterior</button>
        <button class="btn btn-primary" style="flex:1" onclick="cfSave()" ${f.items.length===0?'disabled':''}>${ico('ti-check')} Guardar plantilla</button>
      </div>`;
  }
}

function cfTipo(t){S.createForm.tipo=t;renderCreate();}
function cfInfo(){const f=S.createForm,el=document.getElementById('cf-info');if(el)el.textContent=`${f.torres*f.pisos} zonas de pisos (${f.torres} torre${f.torres>1?'s':''} × ${f.pisos} piso${f.pisos>1?'s':''})`;}
function cfNext1(){const n=document.getElementById('cf-nom');if(n)S.createForm.nombre=n.value.trim();if(!S.createForm.nombre)return;cfStep(2);}
function cfStep(s){S.createStep=s;renderCreate();}
function cfTogZ(z){const i=S.createForm.zonasComunes.indexOf(z);if(i>=0)S.createForm.zonasComunes.splice(i,1);else S.createForm.zonasComunes.push(z);renderCreate();}
function cfAddZ(){const i=document.getElementById('cz-inp');if(i&&i.value.trim()&&!S.createForm.zonasComunes.includes(i.value.trim())){S.createForm.zonasComunes.push(i.value.trim());renderCreate();}}
function cfTogIt(id){const has=S.createForm.items.some(i=>i.id===id);if(has)S.createForm.items=S.createForm.items.filter(i=>i.id!==id);else{const it=ITEMS_DEF.find(i=>i.id===id);if(it)S.createForm.items.push({...it});}renderCreate();}
function cfDelIt(id){S.createForm.items=S.createForm.items.filter(i=>i.id!==id);renderCreate();}
function cfAddIt(){const i=document.getElementById('ci-inp');if(i&&i.value.trim()){S.createForm.items.push({id:uid(),label:i.value.trim(),icon:'ti-point'});i.value='';renderCreate();}}
async function cfSave(){
  const c={...S.createForm,id:uid(),createdAt:new Date().toISOString()};
  await dbPut('conjuntos',c);
  S.conjuntos.push(c);
  showToast('Conjunto guardado ✓');
  goTo('home');
}

// ============================================================
// RECORRIDO
// ============================================================
async function doStartRec(cid) {
  const c=S.conjuntos.find(x=>x.id===cid);if(!c)return;
  S.activeConjunto=c;
  S.recorrido=initRec(c);
  S.selZone=S.recorrido.zones[0]?.id;
  S.openGroups=new Set([S.recorrido.zones[0]?.group]);
  goTo('recorrido');
}

function renderRec(){renderRecTop();renderRecSb();renderRecItems();}

function renderRecTop() {
  const rec=S.recorrido,p=recProg(rec);
  document.getElementById('rec-top').innerHTML=`
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:10px">
      <button class="btn btn-ghost no-print" style="padding:8px 10px;flex-shrink:0" onclick="goTo('home')">${ico('ti-arrow-left')}</button>
      <div style="flex:1;min-width:0">
        <div style="font-size:15px;font-weight:700;color:#e6edf3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(rec.conjuntoNombre)}</div>
        <div style="font-size:11px;color:#7d8590">${fmtD(rec.fecha)}</div>
      </div>
      <div style="text-align:right;flex-shrink:0">
        <div style="font-size:21px;font-weight:800;color:${p.pct===100?'#3fb950':'#f0a500'};line-height:1">${p.pct}%</div>
        <div style="font-size:10px;color:#7d8590">${p.done}/${p.total}</div>
      </div>
    </div>
    <div class="pbar"><div class="pbar-f" style="width:${p.pct}%;background:${p.pct===100?'#3fb950':'#f0a500'}"></div></div>
    ${p.nov>0?`<div style="font-size:12px;color:#f85149;margin-top:5px">${ico('ti-alert-triangle')} ${p.nov} novedad${p.nov!==1?'es':''}</div>`:''}
    <div style="margin-top:8px">
      <input placeholder="Nombre del inspector..." style="font-size:13px;padding:8px 12px" value="${esc(rec.inspector)}" oninput="S.recorrido.inspector=this.value">
    </div>`;
}

function renderRecSb() {
  const rec=S.recorrido;
  const groups=[...new Set(rec.zones.map(z=>z.group))];
  document.getElementById('rec-sb').innerHTML=groups.map(g=>{
    const gz=rec.zones.filter(z=>z.group===g),isOpen=S.openGroups.has(g);
    return `<div class="ghdr" onclick="togGroup('${g}')"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1">${esc(g)}</span><span>${isOpen?'▲':'▼'}</span></div>
    ${isOpen?gz.map(z=>{
      const p=zoneProg(rec.zoneData,z.id),isDone=p.done===p.total&&p.total>0,isAct=z.id===S.selZone;
      return `<div class="zi ${isAct?'zi-active':isDone?'zi-done':''}" onclick="selZone('${z.id}','${g}')">
        <div style="font-size:11px;color:${isAct?'#f0a500':'#e6edf3'};font-weight:${isAct?700:400};line-height:1.3;margin-bottom:2px">${esc(z.label)}</div>
        <div style="font-size:9px;color:#7d8590">${isDone?'✅':p.done>0?p.done+'/'+p.total:'–'}${p.nov>0?` <span style="color:#f85149">⚠${p.nov}</span>`:''}</div>
      </div>`;
    }).join(''):''}`;
  }).join('');
}

function renderRecItems() {
  const rec=S.recorrido,zone=rec.zones.find(z=>z.id===S.selZone);if(!zone)return;
  const zd=rec.zoneData[S.selZone]||{},p=recProg(rec),zp=zoneProg(rec.zoneData,S.selZone);
  const items=rec.items||[],idx=rec.zones.findIndex(z=>z.id===S.selZone),nextZ=rec.zones[idx+1];
  document.getElementById('rec-items').innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <div style="font-size:14px;font-weight:700;color:#e6edf3">${esc(zone.label)}</div>
      <div style="font-size:11px;color:${zp.done===zp.total&&zp.total>0?'#3fb950':'#7d8590'}">${zp.done}/${zp.total}</div>
    </div>
    ${items.map(it=>{
      const d=zd[it.id]||{},isNov=d.status==='novedad';
      return `<div class="ic ${d.status==='ok'?'ic-ok':isNov?'ic-nov':''}" id="ic_${it.id}">
        <div style="display:flex;align-items:center;gap:10px;padding:11px 12px">
          <i class="ti ${it.icon}" style="font-size:17px;color:#7d8590;flex-shrink:0;width:20px;text-align:center" aria-hidden="true"></i>
          <span style="flex:1;font-size:13px;color:#e6edf3;font-weight:500">${esc(it.label)}</span>
          <div style="display:flex;gap:5px;flex-shrink:0">
            <button class="sbtn sbtn-ok ${d.status==='ok'?'on':''}" onclick="setStatus('${it.id}','ok')">✓ OK</button>
            <button class="sbtn sbtn-nov ${isNov?'on':''}" onclick="setStatus('${it.id}','novedad')">⚠ Nov.</button>
          </div>
        </div>
        ${isNov?`<div style="padding:4px 12px 14px;border-top:1px solid #21262d">
          <div class="lbl" style="margin-top:12px">Responsable</div>
          <div style="display:flex;gap:6px;margin-bottom:12px">
            <button class="rbtn rbtn-a ${d.responsable==='Admon'?'on':''}" onclick="setField('${it.id}','responsable','Admon')">${ico('ti-building')}<br>Admon</button>
            <button class="rbtn rbtn-s ${d.responsable==='Seguridad'?'on':''}" onclick="setField('${it.id}','responsable','Seguridad')">${ico('ti-shield')}<br>Seguridad</button>
            <button class="rbtn rbtn-e ${d.responsable==='Aseo'?'on':''}" onclick="setField('${it.id}','responsable','Aseo')">${ico('ti-leaf')}<br>Aseo</button>
          </div>
          <div class="lbl">Descripción</div>
          <textarea rows="2" style="margin-bottom:10px" placeholder="Describe la novedad..." oninput="setField('${it.id}','nota',this.value)">${esc(d.nota||'')}</textarea>
          <div class="lbl">Foto</div>
          ${d.foto
            ?`<div class="ph-wrap"><img src="${d.foto}" alt="foto novedad"><button class="ph-del" onclick="setField('${it.id}','foto',null)">✕</button></div>`
            :`<label class="ph-label">${ico('ti-camera')} Foto<input type="file" accept="image/*" capture="environment" style="display:none;width:auto;border:none;background:none;padding:0" onchange="handlePhoto('${it.id}',this)"></label>`
          }
        </div>`:''}
      </div>`;
    }).join('')}
    <div style="margin-top:14px;padding-bottom:24px;display:flex;flex-direction:column;gap:8px">
      ${nextZ?`<button class="btn btn-ghost btn-full no-print" onclick="selZone('${nextZ.id}','${nextZ.group}')">Siguiente: ${esc(nextZ.label)} ${ico('ti-arrow-right')}</button>`:''}
      ${p.pct===100?`<button class="btn btn-green btn-full no-print" onclick="finishRec()">${ico('ti-check')} Finalizar y generar reportes</button>`:''}
    </div>`;
}

function togGroup(g){if(S.openGroups.has(g))S.openGroups.delete(g);else S.openGroups.add(g);renderRecSb();}
function selZone(zid,g){S.selZone=zid;S.openGroups.add(g);renderRecSb();renderRecItems();}

function setStatus(itemId,status){
  const d=S.recorrido.zoneData[S.selZone][itemId];
  if(d.status===status){d.status=null;d.responsable=null;d.nota='';d.foto=null;}
  else{d.status=status;if(status!=='novedad'){d.responsable=null;d.nota='';d.foto=null;}}
  renderRecTop();renderRecSb();renderRecItems();
}
function setField(itemId,field,val){
  S.recorrido.zoneData[S.selZone][itemId][field]=val;
  renderRecItems();
}
function handlePhoto(itemId,inp){
  const file=inp.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{S.recorrido.zoneData[S.selZone][itemId].foto=ev.target.result;renderRecItems();};
  reader.readAsDataURL(file);
}

async function finishRec(){
  const done={...S.recorrido,doneAt:new Date().toISOString()};
  await dbPut('recorridos',done);
  const cid=done.conjuntoId;
  if(!S.historial[cid])S.historial[cid]=[];
  S.historial[cid].unshift(done);
  if(S.historial[cid].length>10){
    const old=S.historial[cid].pop();
    await dbDel('recorridos',old.id);
  }
  S.reporteRec=done;
  showToast('Recorrido guardado ✓');
  goTo('reporte');
}

// ============================================================
// REPORTE
// ============================================================
function renderReporte() {
  const rec=S.reporteRec;if(!rec)return;
  const p=recProg(rec),novs={Admon:[],Seguridad:[],Aseo:[]};
  rec.zones.forEach(zone=>{
    const zd=rec.zoneData[zone.id]||{};
    (rec.items||[]).forEach(it=>{
      const d=zd[it.id];
      if(d?.status==='novedad'&&d.responsable&&novs[d.responsable]) novs[d.responsable].push({zone:zone.label,it,d});
    });
  });
  const v=document.getElementById('v-reporte');
  v.innerHTML=`<div style="padding:20px;max-width:680px;width:100%;margin:0 auto;padding-bottom:40px">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px" class="no-print">
      <button class="btn btn-ghost" style="padding:8px 10px" onclick="goTo('home')">${ico('ti-arrow-left')}</button>
      <div style="flex:1"><div class="lbl">Recorrido finalizado</div><div style="font-size:17px;font-weight:700;color:#e6edf3">${esc(rec.conjuntoNombre)}</div></div>
    </div>
    <div class="card" style="margin-bottom:16px">
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin-bottom:12px">
        <div><div style="font-size:24px;font-weight:800;color:#3fb950">${p.done-p.nov}</div><div class="lbl">OK</div></div>
        <div><div style="font-size:24px;font-weight:800;color:#f85149">${p.nov}</div><div class="lbl">Novedades</div></div>
        <div><div style="font-size:24px;font-weight:800;color:#f0a500">${p.pct}%</div><div class="lbl">Completado</div></div>
      </div>
      <div style="font-size:12px;color:#7d8590;text-align:center"><span style="color:#e6edf3;font-weight:600">${esc(rec.inspector)||'Sin inspector'}</span> · ${fmtD(rec.fecha)}</div>
    </div>
    <div style="display:flex;gap:6px;margin-bottom:14px" class="no-print">
      ${Object.entries(RESP).map(([key,cfg])=>{
        const cnt=novs[key].length,on=S.activeTab===key;
        return `<button class="tbtn ${cfg.tcls} ${on?'on':''}" onclick="setRepTab('${key}')">${ico(cfg.icon)}<br>${key}<br><span style="font-size:10px">${cnt} nov.</span></button>`;
      }).join('')}
    </div>
    <div style="background:rgba(240,165,0,.08);border:1px solid rgba(240,165,0,.2);border-radius:8px;padding:10px 13px;font-size:12px;color:#f0a500;margin-bottom:14px" class="no-print">
      ${ico('ti-info-circle')} Imprime cada pestaña por separado para obtener los 3 reportes
    </div>
    <div id="rep-content">${repTabHtml(novs)}</div>
    <div style="display:flex;gap:8px;margin-top:18px" class="no-print">
      <button class="btn btn-ghost" style="flex:1" onclick="window.print()">${ico('ti-printer')} Imprimir / PDF</button>
      <button class="btn btn-primary" style="flex:1" onclick="doStartRec(S.activeConjunto?.id)">${ico('ti-plus')} Nuevo recorrido</button>
    </div>
  </div>`;
}

function repTabHtml(novs) {
  if(!novs){
    const rec=S.reporteRec;if(!rec)return'';
    novs={Admon:[],Seguridad:[],Aseo:[]};
    rec.zones.forEach(zone=>{const zd=rec.zoneData[zone.id]||{};(rec.items||[]).forEach(it=>{const d=zd[it.id];if(d?.status==='novedad'&&d.responsable&&novs[d.responsable])novs[d.responsable].push({zone:zone.label,it,d});});});
  }
  const list=novs[S.activeTab];
  if(list.length===0) return `<div class="empty">${ico('ti-circle-check')} Sin novedades para ${RESP[S.activeTab].label}</div>`;
  return list.map(n=>`<div class="card" style="margin-bottom:10px">
    <div class="lbl" style="margin-bottom:8px">${esc(n.zone)}</div>
    <div style="display:flex;gap:10px;align-items:flex-start">
      <i class="ti ${n.it.icon}" style="font-size:18px;flex-shrink:0;color:#7d8590;margin-top:2px" aria-hidden="true"></i>
      <div style="flex:1;min-width:0">
        <div style="font-weight:700;color:#e6edf3;margin-bottom:4px">${esc(n.it.label)}</div>
        ${n.d.nota?`<div style="font-size:13px;color:#94a3b8;background:#0a0e14;padding:8px 11px;border-radius:6px;margin-bottom:8px">${esc(n.d.nota)}</div>`:''}
        ${n.d.foto?`<img src="${n.d.foto}" style="max-width:200px;border-radius:8px;display:block" alt="foto novedad">`:''}
      </div>
    </div>
  </div>`).join('');
}

function setRepTab(t){
  S.activeTab=t;
  document.querySelectorAll('.tbtn').forEach(b=>{
    b.classList.remove('on');
    if(b.getAttribute('onclick')===`setRepTab('${t}')`) b.classList.add('on');
  });
  const rc=document.getElementById('rep-content');
  if(rc)rc.innerHTML=repTabHtml(null);
}

// ============================================================
// HISTORIAL
// ============================================================
function doViewHist(cid){S.histConjunto=S.conjuntos.find(c=>c.id===cid);S.activeConjunto=S.histConjunto;goTo('historial');}

function renderHist() {
  const c=S.histConjunto;if(!c)return;
  const recs=S.historial[c.id]||[];
  document.getElementById('v-historial').innerHTML=`
    <div style="padding:20px;max-width:680px;width:100%;margin:0 auto;padding-bottom:40px">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px">
        <button class="btn btn-ghost" style="padding:8px 10px" onclick="goTo('home')">${ico('ti-arrow-left')}</button>
        <div><div class="lbl">Historial</div><div style="font-size:17px;font-weight:700;color:#e6edf3">${esc(c.nombre)}</div></div>
      </div>
      ${recs.length===0
        ?`<div class="empty">${ico('ti-clipboard')} Aún no hay recorridos guardados</div>`
        :recs.map(rec=>{
          const p=recProg(rec);
          return `<div class="card" style="margin-bottom:10px">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px">
              <div>
                <div style="font-weight:700;color:#e6edf3;margin-bottom:2px">${fmtD(rec.fecha)}</div>
                <div style="font-size:12px;color:#7d8590">Inspector: ${esc(rec.inspector||'—')}</div>
              </div>
              <div style="text-align:right">
                <div style="font-size:18px;font-weight:800;color:#3fb950">${p.pct}%</div>
                ${p.nov>0?`<div style="font-size:11px;color:#f85149">${ico('ti-alert-triangle')} ${p.nov} novedades</div>`:''}
              </div>
            </div>
            <button class="btn btn-ghost btn-full" style="font-size:13px" onclick="viewHistRep('${rec.id}')">Ver reporte ${ico('ti-arrow-right')}</button>
          </div>`;
        }).join('')}
    </div>`;
}

function viewHistRep(recId){
  const rec=(S.historial[S.histConjunto?.id]||[]).find(r=>r.id===recId);
  if(rec){S.reporteRec=rec;goTo('reporte');}
}

// ============================================================
// INIT
// ============================================================
async function init() {
  await openDB();
  S.conjuntos=await dbAll('conjuntos');
  const allRecs=await dbAll('recorridos');
  allRecs.sort((a,b)=>b.fecha.localeCompare(a.fecha));
  allRecs.forEach(rec=>{
    if(!S.historial[rec.conjuntoId])S.historial[rec.conjuntoId]=[];
    if(S.historial[rec.conjuntoId].length<10)S.historial[rec.conjuntoId].push(rec);
  });
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
  goTo('home');
}

init();
</script>
</body>
</html>
