<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<script>try{if(localStorage.getItem('recorridapp_theme')==='light')document.documentElement.setAttribute('data-theme','light');}catch(e){}</script>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0d1117" id="meta-theme-color">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="RecorridAPP">
<link rel="manifest" href="manifest.json">
<title>RecorridAPP</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.9.0/tabler-icons.min.css">
<style>
:root{
  --bg:#0d1117;--bg-input:#0a0e14;--card:#161b22;--border:#21262d;--border2:#30363d;
  --text:#e6edf3;--muted:#7d8590;--muted2:#555;--on-accent:#0d1117;
}
:root[data-theme="light"]{
  --bg:#f4f5f7;--bg-input:#ffffff;--card:#ffffff;--border:#dde1e6;--border2:#c7cdd5;
  --text:#1b1f24;--muted:#5b6472;--muted2:#7b8492;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px;overscroll-behavior:none}
#app{height:100vh;overflow:hidden;position:relative;max-width:720px;margin:0 auto}
.view{display:none;position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.view.active{display:block}
.fview.active{display:flex;flex-direction:column;overflow:hidden}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 18px;border-radius:8px;border:none;cursor:pointer;font-weight:600;font-size:14px;font-family:inherit;transition:opacity .15s;line-height:1;text-align:center}
.btn:active{opacity:.75}
.btnp{background:#f0a500;color:var(--on-accent)}
.btng{background:transparent;color:var(--muted);border:1px solid var(--border)}
.btnv{background:#3fb950;color:var(--on-accent)}
.btnf{width:100%}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px}
.lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;display:block}
.pbar{background:var(--border);border-radius:4px;height:5px;overflow:hidden}
.pbf{height:100%;border-radius:4px;transition:width .4s}
input,textarea,select{background:var(--bg-input);border:1px solid var(--border);border-radius:8px;padding:10px 13px;color:var(--text);font-size:13px;font-family:inherit;outline:none;width:100%;display:block}
input:focus,textarea:focus{border-color:#f0a500}
textarea{resize:vertical;min-height:60px}
.chip{display:inline-block;padding:7px 14px;border-radius:20px;font-size:13px;cursor:pointer;border:1px solid transparent;transition:all .2s;user-select:none;touch-action:manipulation}
.chip-off{background:var(--border);color:var(--muted)}
.chip-on{background:rgba(240,165,0,.15);color:#f0a500;border-color:rgba(240,165,0,.4)}
.chip-mand{background:rgba(240,165,0,.05);color:var(--muted2);border:1px solid var(--border);cursor:default}
.zi{padding:10px 12px;cursor:pointer;border-bottom:1px solid var(--card);border-left:3px solid transparent;transition:all .15s;touch-action:manipulation}
.zi-a{background:rgba(240,165,0,.08);border-left-color:#f0a500}
.zi-d{border-left-color:#3fb950}
.ic{background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:8px;overflow:hidden;transition:border-color .2s}
.ic-ok{border-color:rgba(63,185,80,.3)}
.ic-nov{border-color:rgba(248,81,73,.35)}
.sbtn{padding:7px 10px;border-radius:6px;border:none;cursor:pointer;font-size:12px;font-weight:700;font-family:inherit;transition:all .15s;touch-action:manipulation}
.sbtn-ok{background:rgba(63,185,80,.1);color:#3fb950}
.sbtn-ok.on{background:#3fb950;color:var(--on-accent)}
.sbtn-nov{background:rgba(248,81,73,.1);color:#f85149}
.sbtn-nov.on{background:#f85149;color:var(--on-accent)}
.sbtn-na{background:rgba(125,133,144,.1);color:var(--muted);border:1px solid var(--border)}
.sbtn-na.on{background:var(--border2);color:var(--text)}
.ic-na{border-color:var(--border);opacity:.55}
.rbtn{flex:1;padding:8px 4px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--muted);font-weight:600;font-size:11px;cursor:pointer;font-family:inherit;transition:all .15s;text-align:center;line-height:1.5;touch-action:manipulation}
.rbtn-a.on{border-color:#f0a500;background:rgba(240,165,0,.12);color:#f0a500}
.rbtn-s.on{border-color:#4d9ef7;background:rgba(77,158,247,.12);color:#4d9ef7}
.rbtn-e.on{border-color:#42b96a;background:rgba(66,185,106,.12);color:#42b96a}
.rbtn-p.on{border-color:#c084fc;background:rgba(192,132,252,.12);color:#c084fc}
.tbtn{flex:1;padding:9px 4px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--muted);font-weight:600;font-size:11px;cursor:pointer;font-family:inherit;transition:all .15s;text-align:center;line-height:1.5;touch-action:manipulation}
.tbtn-a.on{border-color:#f0a500;background:rgba(240,165,0,.12);color:#f0a500}
.tbtn-s.on{border-color:#4d9ef7;background:rgba(77,158,247,.12);color:#4d9ef7}
.tbtn-e.on{border-color:#42b96a;background:rgba(66,185,106,.12);color:#42b96a}
.tbtn-p.on{border-color:#c084fc;background:rgba(192,132,252,.12);color:#c084fc}
.ghdr{padding:8px 12px;font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid var(--border);cursor:pointer;display:flex;justify-content:space-between;align-items:center;background:var(--bg-input);user-select:none;touch-action:manipulation}
.ss{flex:1;height:3px;border-radius:2px;transition:background .3s}
.ph-add{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;background:var(--bg-input);border:1px dashed var(--border2);border-radius:8px;cursor:pointer;font-size:12px;color:var(--muted);touch-action:manipulation}
.ph-gallery{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.ph-item{position:relative;width:140px}
.ph-item img{width:140px;height:110px;object-fit:cover;border-radius:8px;display:block}
.ph-item input{margin-top:4px;font-size:11px;padding:5px 8px}
.ph-del{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.75);border:none;color:white;border-radius:4px;padding:2px 7px;cursor:pointer;font-size:12px;touch-action:manipulation}
.zone-extras{border-top:1px solid var(--border);margin-top:14px;padding-top:14px}
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty i{font-size:40px;display:block;margin-bottom:12px;opacity:.4}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#3fb950;color:var(--on-accent);padding:10px 20px;border-radius:8px;font-weight:700;font-size:13px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.suggest-box{background:var(--card);border:1px solid #f0a500;border-radius:8px;margin-top:4px;overflow:hidden}
.suggest-item{padding:9px 12px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--border);touch-action:manipulation}
.suggest-item:last-child{border-bottom:none}
.suggest-item:hover,.suggest-item:active{background:rgba(240,165,0,.08)}
.group-rep{font-size:10px;padding:2px 7px;border-radius:4px;border:none;background:rgba(240,165,0,.1);color:#f0a500;cursor:pointer;touch-action:manipulation;flex-shrink:0}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
@media print{
  :root{--bg:#fff;--bg-input:#fff;--card:#fff;--border:#ddd;--border2:#ddd;--text:#111;--muted:#555;--muted2:#555}
  .no-print{display:none!important}
  body{background:white!important;color:#111!important;font-family:Arial,sans-serif}
  /* Ocultar todo excepto el reporte activo */
  #v-home,#v-create,#v-recorrido,#v-historial{display:none!important}
  #app{height:auto!important;overflow:visible!important;max-width:100%!important}
  #v-reporte{position:static!important;display:block!important;overflow:visible!important;height:auto!important}
  .card{background:white!important;border:1px solid #ddd!important;break-inside:avoid;margin-bottom:12px}
  .ic,.ph-item{background:white!important;border:1px solid #ddd!important;break-inside:avoid}
  input,textarea{border:none!important;background:transparent!important;color:#111!important}
  /* Título del informe visible */
  .print-title{display:block!important;font-size:20px;font-weight:700;margin-bottom:4px;color:#111}
  .print-sub{display:block!important;font-size:13px;color:var(--muted2);margin-bottom:16px}
  /* Ocultar tabs y filtros pero mostrar contenido */
  #rep-content{display:block!important}
}
</style>
</head>
<body>
<div id="app">
  <div id="v-home" class="view"></div>
  <div id="v-create" class="view"></div>
  <div id="v-recorrido" class="view fview"></div>
  <div id="v-reporte" class="view"></div>
  <div id="v-historial" class="view"></div>
</div>
<!-- Inputs de foto globales — evita bug de Samsung Browser con label+input inside scrollable -->
<!-- capture="environment" obliga a abrir la cámara directamente: algunos celulares no muestran la opción de cámara en el selector genérico del sistema -->
<input id="ph-file-input" type="file" accept="image/*" capture="environment" style="display:none;position:fixed;top:-9999px">
<input id="ph-file-input-gallery" type="file" accept="image/*" style="display:none;position:fixed;top:-9999px">
<div class="toast" id="toast"></div>
<button id="theme-toggle" class="no-print" title="Cambiar tema claro/oscuro" aria-label="Cambiar tema claro/oscuro" style="position:fixed;top:max(10px,env(safe-area-inset-top));right:10px;z-index:50;width:38px;height:38px;border-radius:50%;border:1px solid var(--border);background:var(--card);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation;font-size:18px">
  <i class="ti ti-sun" id="theme-toggle-icon" aria-hidden="true"></i>
</button>

let idb;
async function openDB(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open('RecorridAPP',2);
    r.onupgradeneeded=e=>{
      const d=e.target.result;
      if(!d.objectStoreNames.contains('conjuntos'))d.createObjectStore('conjuntos',{keyPath:'id'});
      if(!d.objectStoreNames.contains('recorridos')){
        const s=d.createObjectStore('recorridos',{keyPath:'id'});
        s.createIndex('conjuntoId','conjuntoId',{unique:false});
      }
    };
    r.onsuccess=e=>{idb=e.target.result;res(idb);};
    r.onerror=()=>rej(r.error);
  });
}
const tx=(s,m)=>idb.transaction(s,m).objectStore(s);
const dbGet=(s,k)=>new Promise((r,j)=>{const q=tx(s).get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error);});
const dbAll=(s)=>new Promise((r,j)=>{const q=tx(s).getAll();q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error);});
const dbPut=(s,o)=>new Promise((r,j)=>{const q=tx(s,'readwrite').put(o);q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error);});
const dbDel=(s,k)=>new Promise((r,j)=>{const q=tx(s,'readwrite').delete(k);q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error);});
const dbIdx=(s,i,v)=>new Promise((r,j)=>{const q=tx(s).index(i).getAll(v);q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error);});

function getTorreName(idx,cf){
  if(cf.torreNaming==='letra')return String.fromCharCode(65+idx);
  if(cf.torreNaming==='custom'&&cf.torreNames[idx])return cf.torreNames[idx];
  return String(idx+1);
}

function getZoneItems(zoneType,escSep){
  const items=[...(ZC[zoneType]?.items||[])].map(i=>({...i}));
  if(zoneType==='pisos_torre'&&!escSep){
    items.push({id:'escaleras',label:'Escaleras',icon:'ti-stairs'});
    items.push({id:'barandas',label:'Barandas',icon:'ti-barrier-block'});
  }
  return items;
}

function buildZones(c){
  const z=[],tipo=c.tipo||'apartamentos';
  if(tipo!=='casas'){
    const nT=c.torres||1;
    for(let t=0;t<nT;t++){
      const tn=getTorreName(t,c);
      const grp=nT>1?`Torre ${tn}`:'Pisos';
      for(let p=1;p<=(c.pisos||1);p++){
        z.push({id:`t${t}p${p}`,label:`Piso ${p}`,group:grp,type:'piso',zoneType:'pisos_torre'});
      }
      if(c.escalerasSep){
        z.push({id:`pf${t}`,label:nT>1?`Punto fijo`:'Punto fijo / Escaleras',group:grp,type:'pf',zoneType:'puntos_fijos'});
      }
    }
  }
  (MAND[tipo]||[]).forEach(zt=>z.push({id:`m_${zt}`,label:ZC[zt]?.label||zt,group:'Zonas comunes',type:'comun',zoneType:zt}));
  // Sótanos automáticos según cantidad configurada
  const nSot=c.sotanos||0;
  for(let s=1;s<=nSot;s++){
    const lbl=nSot>1?`Sótano ${s}`:'Sótano';
    z.push({id:`sot_${s}`,label:lbl,group:'Sótanos',type:'comun',zoneType:'sotanos'});
  }
  // Calles internas para casas
  const nCal=c.calles||0;
  for(let k=0;k<nCal;k++){
    const lbl=c.calleNames?.[k]||`Calle ${k+1}`;
    z.push({id:`cal_${k}`,label:lbl,group:'Calles internas',type:'comun',zoneType:'calles'});
  }
  // Pasillos de locales para mixto/comercial
  const nPas=c.pasillos||0;
  for(let p=0;p<nPas;p++){
    const lbl=c.pasilloNames?.[p]||`Pasillo ${p+1}`;
    z.push({id:`pas_${p}`,label:lbl,group:'Pasillos de locales',type:'comun',zoneType:'pasillo_loc'});
  }
  (c.zonasEleg||[]).forEach((ze,i)=>{
    const zt=ze.type==='custom'?(ze.baseType||'salon_social'):ze.type;
    z.push({id:`o_${i}`,label:ze.label||ZC[ze.type]?.label||ze.label,group:'Zonas comunes',type:'comun',zoneType:zt});
  });
  return z;
}

function initRec(c){
  const zones=buildZones(c),zoneItems={},zoneData={},zoneExtras={};
  zones.forEach(z=>{
    const items=getZoneItems(z.zoneType,c.escalerasSep);
    zoneItems[z.id]=items;
    zoneData[z.id]={};
    items.forEach(it=>{zoneData[z.id][it.id]={status:null,novedades:[]};});
    zoneExtras[z.id]={comentario:'',fotos:[]};
  });
  return {id:uid(),conjuntoId:c.id,conjuntoNombre:c.nombre,fecha:today(),
    inspector:'',zones,zoneItems,zoneData,zoneExtras,doneAt:null};
}

function recProg(rec){
  let done=0,total=0,nov=0;
  rec.zones.forEach(z=>Object.values(rec.zoneData[z.id]||{}).forEach(d=>{
    if(d.status==='na')return; // N/A no cuenta
    total++;if(d.status)done++;if(d.status==='novedad')nov++;
  }));
  return{done,total,nov,pct:total?Math.round(done/total*100):0};
}
function zoneProg(rec,zid){
  let done=0,total=0,nov=0;
  Object.values(rec.zoneData[zid]||{}).forEach(d=>{
    if(d.status==='na')return; // N/A no cuenta
    total++;if(d.status)done++;if(d.status==='novedad')nov++;
  });
  return{done,total,nov};
}

async function doDel(cid){
  if(!confirm('¿Eliminar este conjunto y todo su historial?'))return;
  await dbDel('conjuntos',cid);
  const recs=await dbIdx('recorridos','conjuntoId',cid);
  await Promise.all(recs.map(r=>dbDel('recorridos',r.id)));
  S.conjuntos=S.conjuntos.filter(c=>c.id!==cid);
  delete S.historial[cid];
  rHome();toast('Conjunto eliminado');
}

          const inp=document.getElementById('tn-'+i);

      S.cf.calleNames=Array.from({length:S.cf.calles}).map((_,i)=>{
        const inp=document.getElementById('cn-'+i);
        return inp?inp.value.trim()||`Calle ${i+1}`:`Calle ${i+1}`;
      });
    }
    S.step=2;rCreate();
  };
}

  document.getElementById('step-body').innerHTML=`

    </div>

    ${f.zonasEleg.filter(z=>z.type==='custom').length>0?`
      <div style="margin-top:8px">

        <div style="display:flex;flex-direction:column;gap:6px;margin-top:6px">
          ${f.zonasEleg.filter(z=>z.type==='custom').map((z,i)=>`

              <span style="flex:1;font-size:13px">${esc(z.label)}</span>
              <span style="font-size:11px;color:var(--muted)">≈ ${ZC[z.baseType]?.label||z.baseType}</span>
              <button class="ph-del" style="position:static" data-del-custom="${i}">&times;</button>
            </div>`).join('')}
        </div>
      </div>`:''}
    <div style="display:flex;gap:8px;margin-top:20px">

      <button class="btn btnp" style="flex:1" id="next2">Siguiente ${ico('ti-arrow-right')}</button>
    </div>`;

  document.getElementById('back2').onclick=()=>{S.step=1;rCreate();};
  document.getElementById('next2').onclick=()=>{S.step=3;rCreate();};

  // Optional zone chips — event delegation
  document.getElementById('opt-chips').addEventListener('click',e=>{
    const d=e.target.closest('[data-opt]');if(!d)return;
    const zt=d.dataset.opt;
    const idx=S.cf.zonasEleg.findIndex(z=>z.type===zt);
    if(idx>=0)S.cf.zonasEleg.splice(idx,1);
    else S.cf.zonasEleg.push({type:zt,label:ZC[zt]?.label||zt});
    renderStep2();
  });

  // Custom zone - always salon_social template
  const customInp=document.getElementById('custom-z-inp');
  document.getElementById('add-custom-z').onclick=()=>{
    const label=customInp.value.trim();
    if(!label)return;
    S.cf.zonasEleg.push({type:'custom',label,baseType:'salon_social'});
    customInp.value='';
    renderStep2();
  };
  customInp.addEventListener('keydown',e=>{if(e.key==='Enter'){document.getElementById('add-custom-z').click();}});

  document.getElementById('step-body').addEventListener('click',e=>{
    const d=e.target.closest('[data-del-custom]');if(!d)return;
    const customs=S.cf.zonasEleg.filter(z=>z.type==='custom');
    const idx=parseInt(d.dataset.delCustom);
    const toRemove=customs[idx];
    S.cf.zonasEleg=S.cf.zonasEleg.filter(z=>z!==toRemove);
    renderStep2();
  });

// RECORRIDO

async function doStart(cid){
  const c=S.conjuntos.find(x=>x.id===cid);if(!c)return;
  S.activeConj=c;S.recorrido=initRec(c);
  S.selZone=S.recorrido.zones[0]?.id;
  S.openGroups=new Set([S.recorrido.zones[0]?.group]);
  _sbBound=false;_bodyBound=false; // reset so events bind fresh
  goTo('recorrido');
}

function rRec(){
  const v=document.getElementById('v-recorrido');
  v.innerHTML=`
    <div id="rec-top" style="background:var(--card);border-bottom:1px solid var(--border);padding:12px 14px;flex-shrink:0"></div>
    <div style="display:flex;flex:1;overflow:hidden">
      <div id="rec-sb" style="width:120px;border-right:1px solid var(--border);overflow-y:auto;flex-shrink:0;background:var(--bg-input)"></div>
      <div id="rec-body" style="flex:1;overflow-y:auto;padding:12px 14px;-webkit-overflow-scrolling:touch"></div>
    </div>`;
  rRecTop();rRecSb();rRecBody();
  // Bind events ONCE on stable containers
  bindSbEvents();
  bindBodyEvents();
}

function rRecTop(){
  const rec=S.recorrido,p=recProg(rec);
  const el=document.getElementById('rec-top');if(!el)return;
  el.innerHTML=`
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
      <button class="btn btng no-print" style="padding:8px 10px;flex-shrink:0" id="rec-back">${ico('ti-arrow-left')}</button>
      <div style="flex:1;min-width:0">
        <div style="font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(rec.conjuntoNombre)}</div>
        <div style="font-size:11px;color:var(--muted)">${fmtD(rec.fecha)}</div>
      </div>
      <div style="text-align:right;flex-shrink:0">
        <div style="font-size:20px;font-weight:800;color:${p.pct===100?'#3fb950':'#f0a500'};line-height:1">${p.pct}%</div>
        <div style="font-size:10px;color:var(--muted)">${p.done}/${p.total}</div>
      </div>
    </div>
    <div class="pbar"><div class="pbf" style="width:${p.pct}%;background:${p.pct===100?'#3fb950':'#f0a500'}"></div></div>
    ${p.nov>0?`<div style="font-size:12px;color:#f85149;margin-top:5px">${ico('ti-alert-triangle')} ${p.nov} novedad${p.nov!==1?'es':''}</div>`:''}
    <div style="margin-top:8px">
      <input id="inspector-inp" placeholder="Nombre del inspector..." style="font-size:13px;padding:8px 12px" value="${esc(rec.inspector)}">
    </div>`;
  // Re-attach top-level direct handlers (safe, replaced each time with innerHTML)
  document.getElementById('rec-back').onclick=()=>goTo('home');
  document.getElementById('inspector-inp').oninput=e=>{S.recorrido.inspector=e.target.value;};
}

function rRecSb(){
  const rec=S.recorrido,el=document.getElementById('rec-sb');if(!el)return;
  const groups=[...new Set(rec.zones.map(z=>z.group))];
  el.innerHTML=groups.map(g=>{
    const gz=rec.zones.filter(z=>z.group===g),isOpen=S.openGroups.has(g);
    return`<div class="ghdr" data-grp="${esc(g)}">
        <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;font-size:9px">${esc(g)}</span>
        <div style="display:flex;align-items:center;gap:3px">
          <button class="group-rep" data-rep-grp="${esc(g)}" title="Descargar informe de esta sección" style="font-size:9px;padding:2px 5px">📄PDF</button>
          <span style="font-size:10px">${isOpen?'▲':'▼'}</span>
        </div>
      </div>
      ${isOpen?gz.map(z=>{
        const zp=zoneProg(rec,z.id),isDone=zp.done===zp.total&&zp.total>0,isAct=z.id===S.selZone;
        return`<div class="zi ${isAct?'zi-a':isDone?'zi-d':''}" data-zid="${z.id}" data-zgrp="${esc(g)}">
          <div style="font-size:11px;color:${isAct?'#f0a500':'var(--text)'};font-weight:${isAct?700:400};line-height:1.3;margin-bottom:2px">${esc(z.label)}</div>
          <div style="font-size:9px;color:var(--muted)">${isDone?'✅':zp.done>0?zp.done+'/'+zp.total:'–'}${zp.nov>0?` <span style="color:#f85149">⚠${zp.nov}</span>`:''}</div>
        </div>`;}).join(''):''}`;
  }).join('');
}

function rRecBody(){
  const rec=S.recorrido,zid=S.selZone,el=document.getElementById('rec-body');
  if(!el||!rec)return;
  const zone=rec.zones.find(z=>z.id===zid);if(!zone)return;
  const items=rec.zoneItems[zid]||[];
  const zd=rec.zoneData[zid]||{};
  const ze=rec.zoneExtras[zid]||{comentario:'',fotos:[]};
  const p=recProg(rec),zp=zoneProg(rec,zid);
  const idx=rec.zones.findIndex(z=>z.id===zid),nextZ=rec.zones[idx+1];

  el.innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--border)">
      <div style="font-size:15px;font-weight:700">${esc(zone.label)}</div>
      <div style="font-size:11px;color:${zp.done===zp.total&&zp.total>0?'#3fb950':'var(--muted)'};font-weight:600">${zp.done}/${zp.total}</div>
    </div>

    ${items.map(it=>{
      const d=zd[it.id]||{status:null,responsable:null,descripcion:'',fotos:[]};
      const isNov=d.status==='novedad',isNA=d.status==='na',isOK=d.status==='ok';
      return`<div class="ic ${isOK?'ic-ok':isNov?'ic-nov':isNA?'ic-na':''}" style="margin-bottom:10px">
        <!-- Row 1: icon + name -->

// ── Bind sidebar ONCE ──────────────────────────────────────
let _sbBound=false;
function bindSbEvents(){
  if(_sbBound)return;_sbBound=true;
  document.getElementById('v-recorrido').addEventListener('click',e=>{
    // Only handle sidebar clicks
    if(!e.target.closest('#rec-sb'))return;
    const repGrp=e.target.closest('[data-rep-grp]');
    if(repGrp){e.stopPropagation();genGroupReport(repGrp.dataset.repGrp);return;}
    const grp=e.target.closest('[data-grp]');
    if(grp&&!repGrp){const g=grp.dataset.grp;if(S.openGroups.has(g))S.openGroups.delete(g);else S.openGroups.add(g);rRecSb();return;}
    const zi=e.target.closest('[data-zid]');
    if(zi){S.selZone=zi.dataset.zid;S.openGroups.add(zi.dataset.zgrp);rRecSb();rRecBody();return;}
  });
}

// ── Bind body ONCE ─────────────────────────────────────────
let _bodyBound=false;
function bindBodyEvents(){
  if(_bodyBound)return;_bodyBound=true;
  const v=document.getElementById('v-recorrido');

  v.addEventListener('click',e=>{
    if(!e.target.closest('#rec-body'))return;

    // Status (OK / Novedad / N/A)
    const st=e.target.closest('[data-st]');
    if(st){
      const{st:status,iid}=st.dataset,zid=S.selZone;
      const zoneData=S.recorrido.zoneData[zid];
      if(!zoneData||!zoneData[iid])return;
      const d=zoneData[iid];
      if(d.status===status){d.status=null;d.novedades=[];}
      else{
        d.status=status;
        if(status==='novedad'){if(!d.novedades||d.novedades.length===0)d.novedades=[mkNov()];}
        else{d.novedades=[];}
      }
      rRecTop();rRecSb();rRecBody();
      autoSaveRec();return;
    }
    // Responsable de novedad
    const respNov=e.target.closest('[data-resp-nov]');
    if(respNov){
      const[iid,ni,key]=respNov.dataset.respNov.split(':');
      const d=S.recorrido.zoneData[S.selZone][iid];
      if(d&&d.novedades[+ni])d.novedades[+ni].responsable=key;
      rRecBody();return;
    }
    // Agregar novedad
    const addNov=e.target.closest('[data-add-nov]');
    if(addNov){
      const iid=addNov.dataset.addNov;
      const d=S.recorrido.zoneData[S.selZone][iid];
      if(d){if(!d.novedades)d.novedades=[];d.novedades.push(mkNov());}
      rRecBody();return;
    }
    // Eliminar novedad
    const delNov=e.target.closest('[data-del-nov]');
    if(delNov){
      const[iid,ni]=delNov.dataset.delNov.split(':');
      const d=S.recorrido.zoneData[S.selZone][iid];
      if(d&&d.novedades)d.novedades.splice(+ni,1);
      rRecBody();return;
    }
    // Responsable (viejo — ya no se usa pero por si acaso)
    const resp=e.target.closest('[data-resp]');
    if(resp){
      const zd=S.recorrido.zoneData[S.selZone];
      if(zd&&zd[resp.dataset.iid])zd[resp.dataset.iid].responsable=resp.dataset.resp;
      rRecBody();return;
    }
    // Delete photo
    const del=e.target.closest('.ph-del[data-ctx]');
    if(del){handlePhotoAction('del',del.dataset.ctx,parseInt(del.dataset.idx));return;}
    // Next zone
    const nxt=e.target.closest('[data-next]');
    if(nxt){S.selZone=nxt.dataset.next;S.openGroups.add(nxt.dataset.nextg);rRecSb();rRecBody();
      document.getElementById('rec-body')?.scrollTo(0,0);return;}
    // Finish
    if(e.target.closest('[data-action="finish"]'))finishRec();
  });

  v.addEventListener('input',e=>{
    if(!e.target.closest('#rec-body'))return;
    // Descripción de novedad indexada
    const descNov=e.target.getAttribute('data-desc-nov');
    if(descNov){
      const[iid,ni]=descNov.split(':');
      const d=S.recorrido.zoneData[S.selZone][iid];
      if(d&&d.novedades[+ni])d.novedades[+ni].descripcion=e.target.value;return;
    }
    const desc=e.target.getAttribute('data-desc');
    if(desc){const zd=S.recorrido.zoneData[S.selZone];if(zd&&zd[desc])zd[desc].descripcion=e.target.value;return;}
    if(e.target.hasAttribute('data-zone-comment')){S.recorrido.zoneExtras[S.selZone].comentario=e.target.value;return;}
    const cap=e.target.getAttribute('data-ctx');
    if(cap&&e.target.hasAttribute('data-idx'))handlePhotoAction('cap',cap,parseInt(e.target.dataset.idx),e.target.value);
  });
}

function handlePhotoAction(action,ctx,idx,val){
  const parts=ctx.split(':');
  let arr;
  if(parts[0]==='novitem'){
    // novitem:zid:iid:novIdx
    const[,zid,iid,ni]=parts;
    const d=S.recorrido.zoneData[zid]?.[iid];
    if(!d||!d.novedades)return;
    if(!d.novedades[+ni])return;
    arr=d.novedades[+ni].fotos;
  } else if(parts[0]==='item'){
    // backward compat: item:zid:iid
    const[,zid,iid]=parts;
    const d=S.recorrido.zoneData[zid]?.[iid];
    if(!d)return;
    if(!d.fotos)d.fotos=[];
    arr=d.fotos;
  } else if(parts[0]==='zone'){
    const zid=parts[1];
    arr=S.recorrido.zoneExtras[zid].fotos;
  } else return;
  if(action==='add'){arr.push({data:val,caption:''});}
  else if(action==='del'){arr.splice(idx,1);}
  else if(action==='cap'){if(arr[idx])arr[idx].caption=val;}
  if(action!=='cap'){rRecBody();}
}

async function finishRec(){
  const done={...S.recorrido,doneAt:new Date().toISOString()};
  await dbPut('recorridos',done);
  const cid=done.conjuntoId;
  if(!S.historial[cid])S.historial[cid]=[];
  S.historial[cid].unshift(done);
  if(S.historial[cid].length>10){
    const old=S.historial[cid].pop();
    await dbDel('recorridos',old.id);
  }
  S.reporteRec=done;S.repGroup='';
  toast('Recorrido guardado ✓');
  goTo('reporte');
}

// Auto-guarda el recorrido en progreso (sin doneAt) para no perder datos
async function autoSaveRec(){
  if(!S.recorrido)return;
  try{await dbPut('recorridos',{...S.recorrido});}catch(e){}
}

// Partial group report
function genGroupReport(group){
  S.reporteRec=S.recorrido;S.repGroup=group;
  goTo('reporte');
}

function rReporte(){
  const rec=S.reporteRec;if(!rec)return;
  const groups=[...new Set(rec.zones.map(z=>z.group))];
  const filtZones=S.repGroup?rec.zones.filter(z=>z.group===S.repGroup):rec.zones;

  // Build novs grouped by zone for each responsable (soporta múltiples novedades por ítem)
  const novsByZone={};
  Object.keys(RESP).forEach(k=>novsByZone[k]={});
  filtZones.forEach(zone=>{
    const zd=rec.zoneData[zone.id]||{};
    const zitems=rec.zoneItems[zone.id]||[];
    zitems.forEach(it=>{
      const d=zd[it.id];
      if(d?.status!=='novedad')return;
      const novs=getNovs(d);
      novs.forEach(nv=>{
        if(!nv.responsable||!novsByZone[nv.responsable])return;
        if(!novsByZone[nv.responsable][zone.id])
          novsByZone[nv.responsable][zone.id]={label:zone.label,items:[]};
        novsByZone[nv.responsable][zone.id].items.push({it,nv});
      });
    });
  });

  // Count novs per tab
  const novCounts={};
  Object.keys(RESP).forEach(k=>{novCounts[k]=Object.values(novsByZone[k]).reduce((s,z)=>s+z.items.length,0);});

  // Stats
  let done=0,total=0,nov=0;
  filtZones.forEach(z=>Object.values(rec.zoneData[z.id]||{}).forEach(d=>{
    if(d.status==='na')return;
    total++;if(d.status)done++;if(d.status==='novedad')nov++;
  }));
  const pct=total?Math.round(done/total*100):0;

  const v=document.getElementById('v-reporte');
  v.innerHTML=`
    <!-- ENCABEZADO IMPRIMIBLE -->
    <div id="print-header" style="display:none">
      <div style="display:flex;align-items:center;gap:16px;margin-bottom:12px">
        <div style="background:#0d1117;border-radius:8px;padding:8px;flex-shrink:0">
          <img src="${LOGO_WHITE}" alt="A&V Victoria Pineda" style="height:56px;display:block">
        </div>
        <div>
          <div class="print-title" id="print-title-txt" style="font-size:18px;font-weight:700;color:#111"></div>
          <div class="print-sub" style="font-size:12px;color:var(--muted2);margin-top:2px">${esc(rec.conjuntoNombre)} · Inspector: ${esc(rec.inspector)||'Sin inspector'} · ${fmtD(rec.fecha)}${S.repGroup?' · Sección: '+esc(S.repGroup):''}</div>
        </div>
      </div>
      <hr style="border:none;border-top:2px solid #111;margin-bottom:16px">
    </div>

    <div style="padding:20px;max-width:700px;width:100%;margin:0 auto;padding-bottom:40px">
      <!-- NAV -->
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px" class="no-print">
        <button class="btn btng" style="padding:8px 10px" id="rep-back">${ico('ti-arrow-left')}</button>
        <div style="flex:1">
          <div class="lbl">Reporte${S.repGroup?' (parcial)':''}</div>
          <div style="font-size:17px;font-weight:700">${esc(rec.conjuntoNombre)}</div>
        </div>
      </div>
      ${S.repGroup?`<div style="background:rgba(77,158,247,.1);border:1px solid rgba(77,158,247,.3);border-radius:8px;padding:10px 14px;font-size:12px;color:#4d9ef7;margin-bottom:14px" class="no-print">
        ${ico('ti-filter')} Sección: <strong>${esc(S.repGroup)}</strong>
        <button class="btn btng" style="font-size:11px;padding:4px 10px;margin-left:8px" id="rep-full">Ver todo</button>
      </div>`:''}
      <!-- FILTRO SECCIÓN -->
      <div class="no-print" style="margin-bottom:14px">
        <div class="lbl">Sección</div>
        <div style="display:flex;flex-wrap:wrap;gap:6px">
          <div class="chip ${!S.repGroup?'chip-on':'chip-off'}" data-filter="">Todas</div>
          ${groups.map(g=>`<div class="chip ${S.repGroup===g?'chip-on':'chip-off'}" data-filter="${esc(g)}">${esc(g)}</div>`).join('')}
        </div>
      </div>
      <!-- RESUMEN -->
      <div class="card" style="margin-bottom:16px">
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center;margin-bottom:12px">

      <div style="display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap" class="no-print">
        ${Object.entries(RESP).map(([key,cfg])=>{const cnt=novCounts[key],on=S.activeTab===key;
          return`<button class="tbtn ${cfg.tcls} ${on?'on':''}" data-tab="${key}">

  document.getElementById('print-btn').onclick=()=>{
    const hdr=document.getElementById('print-header');
    document.getElementById('print-title-txt').textContent=REP_TITLES[S.activeTab]||S.activeTab;
    hdr.style.display='block';
    window.print();
    setTimeout(()=>hdr.style.display='none',500);
  };

  // Print combinado: las 4 pestañas (Admon/Seguridad/Aseo/Postventa) en un solo PDF
  document.getElementById('print-all-btn').onclick=()=>{
    const combinedHtml=buildCombinedReportHtml(rec,filtZones,novsByZone);
    v.innerHTML=`<div style="padding:20px;max-width:700px;width:100%;margin:0 auto;padding-bottom:40px">${combinedHtml}</div>`;
    window.print();
    setTimeout(()=>rReporte(),500);
  };

  v.addEventListener('click',e=>{
    const tab=e.target.closest('[data-tab]');
    if(tab){
      S.activeTab=tab.dataset.tab;
      v.querySelectorAll('.tbtn').forEach(b=>{
        const cfg=RESP[b.dataset.tab];

  });
}

// Construye el HTML de un informe combinado: las 4 pestañas de responsable, una tras otra,
// cada una con su propio encabezado de impresión, separadas por salto de página.
function buildCombinedReportHtml(rec,filtZones,novsByZone){
  return Object.keys(RESP).map((key,i)=>{
    const title=REP_TITLES[key]||key;
    return `<div style="${i>0?'page-break-before:always;break-before:page;padding-top:20px':''}">
      <div style="display:flex;align-items:center;gap:16px;margin-bottom:12px">
        <div style="background:#0d1117;border-radius:8px;padding:8px;flex-shrink:0">
          <img src="${LOGO_WHITE}" alt="A&V Victoria Pineda" style="height:56px;display:block">
        </div>
        <div>
          <div style="font-size:18px;font-weight:700;color:#111">${esc(title)}</div>
          <div style="font-size:12px;color:#555;margin-top:2px">${esc(rec.conjuntoNombre)} · Inspector: ${esc(rec.inspector)||'Sin inspector'} · ${fmtD(rec.fecha)}${S.repGroup?' · Sección: '+esc(S.repGroup):''}</div>
        </div>
      </div>
      <hr style="border:none;border-top:2px solid #111;margin-bottom:16px">
      <div>${repContent(novsByZone,filtZones,rec,key)}</div>
    </div>`;
  }).join('');
}

function repContent(novsByZone,filtZones,rec,tabKey){
  const zoneMap=novsByZone[tabKey||S.activeTab]||{};
  const lines=[];

  filtZones.forEach(zone=>{
    const zd=rec.zoneData[zone.id]||{};
    const items=rec.zoneItems[zone.id]||[];
    // Check if zone has any nov for this tab
    const zEntry=zoneMap[zone.id];
    // Check if zone was fully reviewed (all items done)
    const reviewed=items.every(it=>{const d=zd[it.id];return d&&d.status;});
    // Check if zone has novedades for this tab
    if(zEntry&&zEntry.items.length>0){
      lines.push(`
        <div class="card" style="margin-bottom:12px">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
            <span style="background:#f85149;color:white;border-radius:4px;padding:2px 8px;font-size:11px;font-weight:700">⚠ Novedades</span>
            <span style="font-weight:700;font-size:14px">${esc(zone.label)}</span>
          </div>
          ${zEntry.items.map(({it,nv})=>`
            <div style="border:1px solid #f85149;border-radius:8px;padding:12px;margin-bottom:8px;background:rgba(248,81,73,.04)">
              <div style="display:flex;gap:8px;align-items:flex-start">
                <i class="ti ${it.icon}" style="font-size:16px;color:var(--muted);flex-shrink:0;margin-top:2px" aria-hidden="true"></i>
                <div style="flex:1;min-width:0">
                  <div style="font-weight:700;margin-bottom:4px">${esc(it.label)}</div>
                  ${nv.descripcion?`<div style="font-size:13px;color:#94a3b8;background:var(--bg-input);padding:8px 10px;border-radius:6px;margin-bottom:8px">${esc(nv.descripcion)}</div>`:''}
                  ${(nv.fotos||[]).length>0?`<div class="ph-gallery">${nv.fotos.map(ph=>`<div class="ph-item"><img src="${ph.data}" alt="foto">${ph.caption?`<div style="font-size:11px;color:var(--muted);margin-top:3px">${esc(ph.caption)}</div>`:''}</div>`).join('')}</div>`:''}
                </div>
              </div>
            </div>`).join('')}
        </div>`);
    } else if(reviewed){
      // Zone fully reviewed, no novedades for this tab — compact summary
      lines.push(`
        <div style="display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--card);border:1px solid rgba(63,185,80,.2);border-radius:8px;margin-bottom:6px">
          <span style="color:#3fb950;font-size:16px">✓</span>
          <span style="font-size:13px;color:var(--muted);flex:1">${esc(zone.label)}</span>
          <span style="font-size:11px;color:#3fb950;font-weight:600">Todo OK · Sin novedades</span>
        </div>`);
    } else {
      // Zone not reviewed yet
      lines.push(`
        <div style="display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--card);border:1px solid var(--border);border-radius:8px;margin-bottom:6px;opacity:.5">
          <span style="color:var(--muted);font-size:16px">–</span>
          <span style="font-size:13px;color:var(--muted);flex:1">${esc(zone.label)}</span>
          <span style="font-size:11px;color:var(--muted)">Pendiente</span>
        </div>`);
    }
  });

  return lines.join('');
}

    <div style="padding:20px;max-width:700px;width:100%;margin:0 auto;padding-bottom:40px">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px">
        <button class="btn btng" style="padding:8px 10px" id="hist-back">${ico('ti-arrow-left')}</button>
        <div><div class="lbl">Historial</div><div style="font-size:17px;font-weight:700">${esc(c.nombre)}</div></div>
      </div>
      ${recs.length===0?`<div class="empty">${ico('ti-clipboard')} Sin recorridos guardados aún</div>`
        :recs.map(rec=>{const p=recProg(rec);return`<div class="card" style="margin-bottom:10px">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px">
            <div>
              <div style="font-weight:700;margin-bottom:2px">${fmtD(rec.fecha)}</div>
              <div style="font-size:12px;color:var(--muted)">Inspector: ${esc(rec.inspector||'—')}</div>
            </div>
            <div style="text-align:right">
              <div style="font-size:18px;font-weight:800;color:#3fb950">${p.pct}%</div>
              ${p.nov>0?`<div style="font-size:11px;color:#f85149">${ico('ti-alert-triangle')} ${p.nov} novedades</div>`:''}
            </div>
          </div>
          <button class="btn btng btnf" style="font-size:13px" data-rec="${rec.id}">Ver reporte ${ico('ti-arrow-right')}</button>
        </div>`;}).join('')}
    </div>`;

  document.getElementById('hist-back').onclick=()=>goTo('home');
  document.getElementById('v-historial').addEventListener('click',e=>{
    const btn=e.target.closest('[data-rec]');
    if(btn){
      const rec=(S.historial[S.histConj?.id]||[]).find(r=>r.id===btn.dataset.rec);
      if(rec){S.reporteRec=rec;S.repGroup='';goTo('reporte');}
    }
  });
}

// ═══════════════════════════════════════════════════════════
// TEMA CLARO / OSCURO
// ═══════════════════════════════════════════════════════════
function applyTheme(t){
  document.documentElement.setAttribute('data-theme',t==='light'?'light':'dark');
  try{localStorage.setItem('recorridapp_theme',t);}catch(e){}
  const icon=document.getElementById('theme-toggle-icon');
  if(icon)icon.className='ti '+(t==='light'?'ti-moon':'ti-sun');
  const mc=document.getElementById('meta-theme-color');
  if(mc)mc.setAttribute('content',t==='light'?'#f4f5f7':'#0d1117');
}
function toggleTheme(){
  const cur=document.documentElement.getAttribute('data-theme')==='light'?'light':'dark';
  applyTheme(cur==='light'?'dark':'light');
}
document.getElementById('theme-toggle').addEventListener('click',toggleTheme);
applyTheme(document.documentElement.getAttribute('data-theme')==='light'?'light':'dark');

// ═══════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════
async function init(){
  await openDB();
  S.conjuntos=await dbAll('conjuntos');
  const all=await dbAll('recorridos');
  all.sort((a,b)=>b.fecha.localeCompare(a.fecha));
  all.forEach(rec=>{
    if(!rec.doneAt){
      // Recorrido en progreso — restaurar para continuar
      if(!S.inProgress)S.inProgress=rec;
      return;
    }
    if(!S.historial[rec.conjuntoId])S.historial[rec.conjuntoId]=[];
    if(S.historial[rec.conjuntoId].length<10)S.historial[rec.conjuntoId].push(rec);
  });
  // Global photo input handler (cámara directa y galería comparten la misma lógica)
  const onPhotoFile=e=>{
    const file=e.target.files?.[0];if(!file)return;
    const ctx=e.target.dataset.ctx;if(!ctx)return;
    const reader=new FileReader();
    reader.onload=ev=>{handlePhotoAction('add',ctx,-1,ev.target.result);};
    reader.readAsDataURL(file);
    e.target.value='';
  };
  document.getElementById('ph-file-input').addEventListener('change',onPhotoFile);
  document.getElementById('ph-file-input-gallery').addEventListener('change',onPhotoFile);
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
  // Si hay recorrido en progreso, ofrecer continuar
  if(S.inProgress){
    const c=S.conjuntos.find(x=>x.id===S.inProgress.conjuntoId);
    if(c&&confirm(`Tienes un recorrido en progreso de "${S.inProgress.conjuntoNombre}" (${fmtD(S.inProgress.fecha)}). ¿Deseas continuar?`)){
      S.activeConj=c;S.recorrido=S.inProgress;
      S.selZone=S.recorrido.zones[0]?.id;
      S.openGroups=new Set([S.recorrido.zones[0]?.group]);
      _sbBound=false;_bodyBound=false;
      goTo('recorrido');return;
    } else {
      // Descartar recorrido en progreso
      await dbDel('recorridos',S.inProgress.id);
      S.inProgress=null;
    }
  }
  goTo('home');
}
init();
</script>
