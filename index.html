<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0d1117;color:#e6edf3;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px;overscroll-behavior:none}
#app{height:100vh;overflow:hidden;position:relative;max-width:720px;margin:0 auto}
.view{display:none;position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.view.active{display:block}
.fview.active{display:flex;flex-direction:column;overflow:hidden}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 18px;border-radius:8px;border:none;cursor:pointer;font-weight:600;font-size:14px;font-family:inherit;transition:opacity .15s;line-height:1;text-align:center}
.btn:active{opacity:.75}
.btnp{background:#f0a500;color:#0d1117}
.btng{background:transparent;color:#7d8590;border:1px solid #21262d}
.btnv{background:#3fb950;color:#0d1117}
.btnf{width:100%}
.card{background:#161b22;border:1px solid #21262d;border-radius:12px;padding:16px}
.lbl{font-size:10px;color:#7d8590;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;display:block}
.pbar{background:#21262d;border-radius:4px;height:5px;overflow:hidden}
.pbf{height:100%;border-radius:4px;transition:width .4s}
input,textarea,select{background:#0a0e14;border:1px solid #21262d;border-radius:8px;padding:10px 13px;color:#e6edf3;font-size:13px;font-family:inherit;outline:none;width:100%;display:block}
input:focus,textarea:focus{border-color:#f0a500}
textarea{resize:vertical;min-height:60px}
.chip{display:inline-block;padding:7px 14px;border-radius:20px;font-size:13px;cursor:pointer;border:1px solid transparent;transition:all .2s;user-select:none;touch-action:manipulation}
.chip-off{background:#21262d;color:#7d8590}
.chip-on{background:rgba(240,165,0,.15);color:#f0a500;border-color:rgba(240,165,0,.4)}
.chip-mand{background:rgba(240,165,0,.05);color:#555;border:1px solid #21262d;cursor:default}
.zi{padding:10px 12px;cursor:pointer;border-bottom:1px solid #161b22;border-left:3px solid transparent;transition:all .15s;touch-action:manipulation}
.zi-a{background:rgba(240,165,0,.08);border-left-color:#f0a500}
.zi-d{border-left-color:#3fb950}
.ic{background:#161b22;border:1px solid #21262d;border-radius:10px;margin-bottom:8px;overflow:hidden;transition:border-color .2s}
.ic-ok{border-color:rgba(63,185,80,.3)}
.ic-nov{border-color:rgba(248,81,73,.35)}
.sbtn{padding:7px 10px;border-radius:6px;border:none;cursor:pointer;font-size:12px;font-weight:700;font-family:inherit;transition:all .15s;touch-action:manipulation}
.sbtn-ok{background:rgba(63,185,80,.1);color:#3fb950}
.sbtn-ok.on{background:#3fb950;color:#0d1117}
.sbtn-nov{background:rgba(248,81,73,.1);color:#f85149}
.sbtn-nov.on{background:#f85149;color:#0d1117}
.sbtn-na{background:rgba(125,133,144,.1);color:#7d8590;border:1px solid #21262d}
.sbtn-na.on{background:#30363d;color:#e6edf3}
.ic-na{border-color:#21262d;opacity:.55}
.rbtn{flex:1;padding:8px 4px;border-radius:8px;border:1px solid #21262d;background:transparent;color:#7d8590;font-weight:600;font-size:11px;cursor:pointer;font-family:inherit;transition:all .15s;text-align:center;line-height:1.5;touch-action:manipulation}
.rbtn-a.on{border-color:#f0a500;background:rgba(240,165,0,.12);color:#f0a500}
.rbtn-s.on{border-color:#4d9ef7;background:rgba(77,158,247,.12);color:#4d9ef7}
.rbtn-e.on{border-color:#42b96a;background:rgba(66,185,106,.12);color:#42b96a}
.rbtn-p.on{border-color:#c084fc;background:rgba(192,132,252,.12);color:#c084fc}
.tbtn{flex:1;padding:9px 4px;border-radius:8px;border:1px solid #21262d;background:#161b22;color:#7d8590;font-weight:600;font-size:11px;cursor:pointer;font-family:inherit;transition:all .15s;text-align:center;line-height:1.5;touch-action:manipulation}
.tbtn-a.on{border-color:#f0a500;background:rgba(240,165,0,.12);color:#f0a500}
.tbtn-s.on{border-color:#4d9ef7;background:rgba(77,158,247,.12);color:#4d9ef7}
.tbtn-e.on{border-color:#42b96a;background:rgba(66,185,106,.12);color:#42b96a}
.tbtn-p.on{border-color:#c084fc;background:rgba(192,132,252,.12);color:#c084fc}
.ghdr{padding:8px 12px;font-size:9px;font-weight:700;color:#7d8590;text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid #21262d;cursor:pointer;display:flex;justify-content:space-between;align-items:center;background:#0a0e14;user-select:none;touch-action:manipulation}
.ss{flex:1;height:3px;border-radius:2px;transition:background .3s}
.ph-add{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;background:#0a0e14;border:1px dashed #30363d;border-radius:8px;cursor:pointer;font-size:12px;color:#7d8590;touch-action:manipulation}
.ph-gallery{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.ph-item{position:relative;width:140px}
.ph-item img{width:140px;height:110px;object-fit:cover;border-radius:8px;display:block}
.ph-item input{margin-top:4px;font-size:11px;padding:5px 8px}
.ph-del{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.75);border:none;color:white;border-radius:4px;padding:2px 7px;cursor:pointer;font-size:12px;touch-action:manipulation}
.zone-extras{border-top:1px solid #21262d;margin-top:14px;padding-top:14px}
.empty{text-align:center;padding:48px 20px;color:#7d8590}
.empty i{font-size:40px;display:block;margin-bottom:12px;opacity:.4}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#3fb950;color:#0d1117;padding:10px 20px;border-radius:8px;font-weight:700;font-size:13px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.suggest-box{background:#161b22;border:1px solid #f0a500;border-radius:8px;margin-top:4px;overflow:hidden}
.suggest-item{padding:9px 12px;cursor:pointer;font-size:13px;border-bottom:1px solid #21262d;touch-action:manipulation}
.suggest-item:last-child{border-bottom:none}
.suggest-item:hover,.suggest-item:active{background:rgba(240,165,0,.08)}
.group-rep{font-size:10px;padding:2px 7px;border-radius:4px;border:none;background:rgba(240,165,0,.1);color:#f0a500;cursor:pointer;touch-action:manipulation;flex-shrink:0}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:#21262d;border-radius:4px}
@media print{
  .no-print{display:none!important}
  body{background:white!important;color:#111!important;font-family:Arial,sans-serif}
  /* Ocultar todo excepto el reporte activo */
  #v-home,#v-create,#v-recorrido,#v-historial{display:none!important}
  #app{height:auto!important;overflow:visible!important;max-width:100%!important}
  #v-reporte{position:static!important;display:block!important;overflow:visible!important;height:auto!important}
  .card{background:white!important;border:1px solid #ddd!important;break-inside:avoid;margin-bottom:12px}
  .ic,.ph-item{background:white!important;border:1px solid #ddd!important;break-inside:avoid}
  input,textarea{border:none!important;background:transparent!important;color:#111!important}
  /* Título del informe visible */
  .print-title{display:block!important;font-size:20px;font-weight:700;margin-bottom:4px;color:#111}
  .print-sub{display:block!important;font-size:13px;color:#555;margin-bottom:16px}
  /* Ocultar tabs y filtros pero mostrar contenido */
  #rep-content{display:block!important}
}

let idb;
async function openDB(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open('RecorridAPP',2);
    r.onupgradeneeded=e=>{
      const d=e.target.result;
      if(!d.objectStoreNames.contains('conjuntos'))d.createObjectStore('conjuntos',{keyPath:'id'});
      if(!d.objectStoreNames.contains('recorridos')){
        const s=d.createObjectStore('recorridos',{keyPath:'id'});
        s.createIndex('conjuntoId','conjuntoId',{unique:false});
      }
    };
    r.onsuccess=e=>{idb=e.target.result;res(idb);};
    r.onerror=()=>rej(r.error);
  });
}
const tx=(s,m)=>idb.transaction(s,m).objectStore(s);
const dbGet=(s,k)=>new Promise((r,j)=>{const q=tx(s).get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error);});
const dbAll=(s)=>new Promise((r,j)=>{const q=tx(s).getAll();q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error);});
const dbPut=(s,o)=>new Promise((r,j)=>{const q=tx(s,'readwrite').put(o);q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error);});
const dbDel=(s,k)=>new Promise((r,j)=>{const q=tx(s,'readwrite').delete(k);q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error);});
const dbIdx=(s,i,v)=>new Promise((r,j)=>{const q=tx(s).index(i).getAll(v);q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error);});

const uid=()=>`${Date.now()}_${Math.random().toString(36).slice(2,5)}`;
const today=()=>new Date().toISOString().split('T')[0];
const fmtD=iso=>{try{return new Date(iso+'T12:00:00').toLocaleDateString('es-CO',{weekday:'short',day:'numeric',month:'short',year:'numeric'});}catch{return iso;}};
const ico=s=>`<i class="ti ${s}" aria-hidden="true"></i>`;
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function getTorreName(idx,cf){
  if(cf.torreNaming==='letra')return String.fromCharCode(65+idx);
  if(cf.torreNaming==='custom'&&cf.torreNames[idx])return cf.torreNames[idx];
  return String(idx+1);
}

function getZoneItems(zoneType,escSep){
  const items=[...(ZC[zoneType]?.items||[])].map(i=>({...i}));
  if(zoneType==='pisos_torre'&&!escSep){
    items.push({id:'escaleras',label:'Escaleras',icon:'ti-stairs'});
    items.push({id:'barandas',label:'Barandas',icon:'ti-barrier-block'});
  }
  return items;
}

function buildZones(c){
  const z=[],tipo=c.tipo||'apartamentos';
  if(tipo!=='casas'){
    const nT=c.torres||1;
    for(let t=0;t<nT;t++){
      const tn=getTorreName(t,c);
      const grp=nT>1?`Torre ${tn}`:'Pisos';
      for(let p=1;p<=(c.pisos||1);p++){
        z.push({id:`t${t}p${p}`,label:`Piso ${p}`,group:grp,type:'piso',zoneType:'pisos_torre'});
      }
      if(c.escalerasSep){
        z.push({id:`pf${t}`,label:nT>1?`Punto fijo`:'Punto fijo / Escaleras',group:grp,type:'pf',zoneType:'puntos_fijos'});
      }
    }
  }
  (MAND[tipo]||[]).forEach(zt=>z.push({id:`m_${zt}`,label:ZC[zt]?.label||zt,group:'Zonas comunes',type:'comun',zoneType:zt}));
  // Sótanos automáticos según cantidad configurada
  const nSot=c.sotanos||0;
  for(let s=1;s<=nSot;s++){
    const lbl=nSot>1?`Sótano ${s}`:'Sótano';
    z.push({id:`sot_${s}`,label:lbl,group:'Sótanos',type:'comun',zoneType:'sotanos'});
  }
  // Calles internas para casas
  const nCal=c.calles||0;
  for(let k=0;k<nCal;k++){
    const lbl=c.calleNames?.[k]||`Calle ${k+1}`;
    z.push({id:`cal_${k}`,label:lbl,group:'Calles internas',type:'comun',zoneType:'calles'});
  }
  // Pasillos de locales para mixto/comercial
  const nPas=c.pasillos||0;
  for(let p=0;p<nPas;p++){
    const lbl=c.pasilloNames?.[p]||`Pasillo ${p+1}`;
    z.push({id:`pas_${p}`,label:lbl,group:'Pasillos de locales',type:'comun',zoneType:'pasillo_loc'});
  }
  (c.zonasEleg||[]).forEach((ze,i)=>{
    const zt=ze.type==='custom'?(ze.baseType||'salon_social'):ze.type;
    z.push({id:`o_${i}`,label:ze.label||ZC[ze.type]?.label||ze.label,group:'Zonas comunes',type:'comun',zoneType:zt});
  });
  return z;
}

function initRec(c){
  const zones=buildZones(c),zoneItems={},zoneData={},zoneExtras={};
  zones.forEach(z=>{
    const items=getZoneItems(z.zoneType,c.escalerasSep);
    zoneItems[z.id]=items;
    zoneData[z.id]={};
    items.forEach(it=>{zoneData[z.id][it.id]={status:null,responsable:null,descripcion:'',fotos:[]};});
    zoneExtras[z.id]={comentario:'',fotos:[]};
  });
  return {id:uid(),conjuntoId:c.id,conjuntoNombre:c.nombre,fecha:today(),
    inspector:'',zones,zoneItems,zoneData,zoneExtras,doneAt:null};
}

function recProg(rec){
  let done=0,total=0,nov=0;
  rec.zones.forEach(z=>Object.values(rec.zoneData[z.id]||{}).forEach(d=>{
    if(d.status==='na')return; // N/A no cuenta
    total++;if(d.status)done++;if(d.status==='novedad')nov++;
  }));
  return{done,total,nov,pct:total?Math.round(done/total*100):0};
}
function zoneProg(rec,zid){
  let done=0,total=0,nov=0;
  Object.values(rec.zoneData[zid]||{}).forEach(d=>{
    if(d.status==='na')return; // N/A no cuenta
    total++;if(d.status)done++;if(d.status==='novedad')nov++;
  });
  return{done,total,nov};
}

async function doDel(cid){
  if(!confirm('¿Eliminar este conjunto y todo su historial?'))return;
  await dbDel('conjuntos',cid);
  const recs=await dbIdx('recorridos','conjuntoId',cid);
  await Promise.all(recs.map(r=>dbDel('recorridos',r.id)));
  S.conjuntos=S.conjuntos.filter(c=>c.id!==cid);
  delete S.historial[cid];
  rHome();toast('Conjunto eliminado');
}

// ── Bind sidebar ONCE ──────────────────────────────────────
let _sbBound=false;
function bindSbEvents(){
  if(_sbBound)return;_sbBound=true;
  document.getElementById('v-recorrido').addEventListener('click',e=>{
    // Only handle sidebar clicks
    if(!e.target.closest('#rec-sb'))return;
    const repGrp=e.target.closest('[data-rep-grp]');
    if(repGrp){e.stopPropagation();genGroupReport(repGrp.dataset.repGrp);return;}
    const grp=e.target.closest('[data-grp]');
    if(grp&&!repGrp){const g=grp.dataset.grp;if(S.openGroups.has(g))S.openGroups.delete(g);else S.openGroups.add(g);rRecSb();return;}
    const zi=e.target.closest('[data-zid]');
    if(zi){S.selZone=zi.dataset.zid;S.openGroups.add(zi.dataset.zgrp);rRecSb();rRecBody();return;}
  });
}

// ── Bind body ONCE ─────────────────────────────────────────
let _bodyBound=false;
function bindBodyEvents(){
  if(_bodyBound)return;_bodyBound=true;
  const v=document.getElementById('v-recorrido');

  v.addEventListener('click',e=>{
    if(!e.target.closest('#rec-body'))return;

    // Status (OK / Novedad / N/A)
    const st=e.target.closest('[data-st]');
    if(st){
      const{st:status,iid}=st.dataset,zid=S.selZone;
      const zoneData=S.recorrido.zoneData[zid];
      if(!zoneData||!zoneData[iid])return;
      const d=zoneData[iid];
      if(d.status===status){d.status=null;}
      else{d.status=status;if(status!=='novedad'){d.responsable=null;d.descripcion='';d.fotos=[];}}
      rRecTop();rRecSb();rRecBody();
      autoSaveRec(); // guardar progreso automáticamente
      return;
    }
    // Responsable
    const resp=e.target.closest('[data-resp]');
    if(resp){
      const zd=S.recorrido.zoneData[S.selZone];
      if(zd&&zd[resp.dataset.iid])zd[resp.dataset.iid].responsable=resp.dataset.resp;
      rRecBody();return;
    }
    // Delete photo
    const del=e.target.closest('.ph-del[data-ctx]');
    if(del){handlePhotoAction('del',del.dataset.ctx,parseInt(del.dataset.idx));return;}
    // Next zone
    const nxt=e.target.closest('[data-next]');
    if(nxt){S.selZone=nxt.dataset.next;S.openGroups.add(nxt.dataset.nextg);rRecSb();rRecBody();
      document.getElementById('rec-body')?.scrollTo(0,0);return;}
    // Finish
    if(e.target.closest('[data-action="finish"]'))finishRec();
  });

  v.addEventListener('input',e=>{
    if(!e.target.closest('#rec-body'))return;
    const desc=e.target.getAttribute('data-desc');
    if(desc){const zd=S.recorrido.zoneData[S.selZone];if(zd&&zd[desc])zd[desc].descripcion=e.target.value;return;}
    if(e.target.hasAttribute('data-zone-comment')){S.recorrido.zoneExtras[S.selZone].comentario=e.target.value;return;}
    const cap=e.target.getAttribute('data-ctx');
    if(cap&&e.target.hasAttribute('data-idx'))handlePhotoAction('cap',cap,parseInt(e.target.dataset.idx),e.target.value);
  });
}

function handlePhotoAction(action,ctx,idx,val){
  // ctx: 'item:zid:iid' or 'zone:zid'
  const parts=ctx.split(':');
  let arr;
  if(parts[0]==='item'){
    const[,zid,iid]=parts;
    if(!S.recorrido.zoneData[zid]){return;}
    arr=S.recorrido.zoneData[zid][iid].fotos;
    if(action==='add'){arr.push({data:val,caption:''});}
    else if(action==='del'){arr.splice(idx,1);}
    else if(action==='cap'){if(arr[idx])arr[idx].caption=val;}
  } else if(parts[0]==='zone'){
    const zid=parts[1];
    arr=S.recorrido.zoneExtras[zid].fotos;
    if(action==='add'){arr.push({data:val,caption:''});}
    else if(action==='del'){arr.splice(idx,1);}
    else if(action==='cap'){if(arr[idx])arr[idx].caption=val;}
  }
  if(action!=='cap'){rRecBody();}
}

async function finishRec(){
  const done={...S.recorrido,doneAt:new Date().toISOString()};
  await dbPut('recorridos',done);
  const cid=done.conjuntoId;
  if(!S.historial[cid])S.historial[cid]=[];
  S.historial[cid].unshift(done);
  if(S.historial[cid].length>10){
    const old=S.historial[cid].pop();
    await dbDel('recorridos',old.id);
  }
  S.reporteRec=done;S.repGroup='';
  toast('Recorrido guardado ✓');
  goTo('reporte');
}

// Auto-guarda el recorrido en progreso (sin doneAt) para no perder datos
async function autoSaveRec(){
  if(!S.recorrido)return;
  try{await dbPut('recorridos',{...S.recorrido});}catch(e){}
}

// Partial group report
function genGroupReport(group){
  S.reporteRec=S.recorrido;S.repGroup=group;
  goTo('reporte');
}

// REPORTE

// Títulos de informe por responsable
const REP_TITLES={
  Admon:'Informe Novedades Administración',
  Seguridad:'Informe Novedades de Seguridad',
  Aseo:'Informe Novedades Empresa de Aseo',
  Postventa:'Informe Pendiente Postventa',
};

function rReporte(){
  const rec=S.reporteRec;if(!rec)return;
  const groups=[...new Set(rec.zones.map(z=>z.group))];
  const filtZones=S.repGroup?rec.zones.filter(z=>z.group===S.repGroup):rec.zones;

  // Build novs grouped by zone for each responsable
  const novsByZone={};
  Object.keys(RESP).forEach(k=>novsByZone[k]={});
  filtZones.forEach(zone=>{
    const zd=rec.zoneData[zone.id]||{};
    const zitems=rec.zoneItems[zone.id]||[];
    const zNovs=[];
    zitems.forEach(it=>{
      const d=zd[it.id];
      if(d?.status==='novedad'&&d.responsable&&novsByZone[d.responsable]!==undefined){
        if(!novsByZone[d.responsable][zone.id])novsByZone[d.responsable][zone.id]={label:zone.label,items:[],extras:rec.zoneExtras?.[zone.id]||null};
        novsByZone[d.responsable][zone.id].items.push({it,d});
      }
    });
  });

  // Count novs per tab
  const novCounts={};
  Object.keys(RESP).forEach(k=>{novCounts[k]=Object.values(novsByZone[k]).reduce((s,z)=>s+z.items.length,0);});

  // Stats
  let done=0,total=0,nov=0;
  filtZones.forEach(z=>Object.values(rec.zoneData[z.id]||{}).forEach(d=>{
    if(d.status==='na')return;
    total++;if(d.status)done++;if(d.status==='novedad')nov++;
  }));
  const pct=total?Math.round(done/total*100):0;

  const v=document.getElementById('v-reporte');
  v.innerHTML=`
    <!-- ENCABEZADO IMPRIMIBLE -->
    <div id="print-header" style="display:none">
      <div class="print-title" id="print-title-txt"></div>
      <div class="print-sub">${esc(rec.conjuntoNombre)} · ${esc(rec.inspector)||'Sin inspector'} · ${fmtD(rec.fecha)}${S.repGroup?' · Sección: '+esc(S.repGroup):''}</div>
      <hr style="border:none;border-top:2px solid #333;margin-bottom:16px">
    </div>

    <div style="padding:20px;max-width:700px;width:100%;margin:0 auto;padding-bottom:40px">
      <!-- NAV -->
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px" class="no-print">
        <button class="btn btng" style="padding:8px 10px" id="rep-back">${ico('ti-arrow-left')}</button>
        <div style="flex:1">
          <div class="lbl">Reporte${S.repGroup?' (parcial)':''}</div>
          <div style="font-size:17px;font-weight:700">${esc(rec.conjuntoNombre)}</div>
        </div>
      </div>
      ${S.repGroup?`<div style="background:rgba(77,158,247,.1);border:1px solid rgba(77,158,247,.3);border-radius:8px;padding:10px 14px;font-size:12px;color:#4d9ef7;margin-bottom:14px" class="no-print">
        ${ico('ti-filter')} Sección: <strong>${esc(S.repGroup)}</strong>
        <button class="btn btng" style="font-size:11px;padding:4px 10px;margin-left:8px" id="rep-full">Ver todo</button>
      </div>`:''}
      <!-- FILTRO SECCIÓN -->
      <div class="no-print" style="margin-bottom:14px">
        <div class="lbl">Sección</div>
        <div style="display:flex;flex-wrap:wrap;gap:6px">
          <div class="chip ${!S.repGroup?'chip-on':'chip-off'}" data-filter="">Todas</div>
          ${groups.map(g=>`<div class="chip ${S.repGroup===g?'chip-on':'chip-off'}" data-filter="${esc(g)}">${esc(g)}</div>`).join('')}
        </div>
      </div>
      <!-- RESUMEN -->
      <div class="card" style="margin-bottom:16px">
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center;margin-bottom:12px">
          <div><div style="font-size:22px;font-weight:800;color:#3fb950">${done-nov}</div><div class="lbl">OK</div></div>
          <div><div style="font-size:22px;font-weight:800;color:#f85149">${nov}</div><div class="lbl">Novedades</div></div>
          <div><div style="font-size:22px;font-weight:800;color:#7d8590">${total-done}</div><div class="lbl">Pendientes</div></div>
          <div><div style="font-size:22px;font-weight:800;color:#f0a500">${pct}%</div><div class="lbl">Completado</div></div>
        </div>
        <div style="font-size:12px;color:#7d8590;text-align:center">
          <span style="color:#e6edf3;font-weight:600">${esc(rec.inspector)||'Sin inspector'}</span> · ${fmtD(rec.fecha)}
        </div>
      </div>
      <!-- TABS -->
      <div style="display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap" class="no-print">
        ${Object.entries(RESP).map(([key,cfg])=>{const cnt=novCounts[key],on=S.activeTab===key;
          return`<button class="tbtn ${cfg.tcls} ${on?'on':''}" data-tab="${key}">
            ${ico(cfg.icon)}<br>${key}<br><span style="font-size:9px">${cnt} nov.</span>
          </button>`;}).join('')}
      </div>
      <div style="background:rgba(240,165,0,.08);border:1px solid rgba(240,165,0,.2);border-radius:8px;padding:10px 13px;font-size:12px;color:#f0a500;margin-bottom:14px" class="no-print">
        ${ico('ti-info-circle')} Imprime cada pestaña por separado — un PDF por responsable
      </div>
      <div id="rep-content">${repContent(novsByZone,filtZones,rec)}</div>
      <div style="display:flex;gap:8px;margin-top:18px;flex-wrap:wrap" class="no-print">
        <button class="btn btng" style="flex:1;min-width:130px" id="print-btn">${ico('ti-printer')} Imprimir / PDF</button>
        <button class="btn btnp" style="flex:1;min-width:130px" id="new-rec-btn">${ico('ti-plus')} Nuevo recorrido</button>
      </div>
    </div>`;

  // Print with title
  document.getElementById('print-btn').onclick=()=>{
    const hdr=document.getElementById('print-header');
    document.getElementById('print-title-txt').textContent=REP_TITLES[S.activeTab]||S.activeTab;
    hdr.style.display='block';
    window.print();
    setTimeout(()=>hdr.style.display='none',500);
  };

  v.addEventListener('click',e=>{
    const tab=e.target.closest('[data-tab]');
    if(tab){
      S.activeTab=tab.dataset.tab;
      v.querySelectorAll('.tbtn').forEach(b=>{
        const cfg=RESP[b.dataset.tab];
        b.className=`tbtn ${cfg?.tcls||''} ${b.dataset.tab===S.activeTab?'on':''}`;
      });
      document.getElementById('rep-content').innerHTML=repContent(novsByZone,filtZones,rec);
      return;
    }
    const flt=e.target.closest('[data-filter]');
    if(flt!==null&&flt.hasAttribute('data-filter')){S.repGroup=flt.dataset.filter;rReporte();return;}
    if(e.target.closest('#rep-back')){
      if(S.recorrido&&!S.recorrido.doneAt)goTo('recorrido');
      else goTo('home');return;
    }
    if(e.target.closest('#rep-full')){S.repGroup='';rReporte();return;}
    if(e.target.closest('#new-rec-btn')){doStart(S.activeConj?.id);return;}
  });
}

function repContent(novsByZone,filtZones,rec){
  const zoneMap=novsByZone[S.activeTab]||{};
  const lines=[];

  filtZones.forEach(zone=>{
    const zd=rec.zoneData[zone.id]||{};
    const items=rec.zoneItems[zone.id]||[];
    // Check if zone has any nov for this tab
    const zEntry=zoneMap[zone.id];
    // Check if zone was fully reviewed (all items done)
    const reviewed=items.every(it=>{const d=zd[it.id];return d&&d.status;});
    // Check if zone has novedades for this tab
    if(zEntry&&zEntry.items.length>0){
      lines.push(`
        <div class="card" style="margin-bottom:12px">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
            <span style="background:#f85149;color:white;border-radius:4px;padding:2px 8px;font-size:11px;font-weight:700">⚠ Novedades</span>
            <span style="font-weight:700;font-size:14px">${esc(zone.label)}</span>
          </div>
          ${zEntry.items.map(({it,d})=>`
            <div style="border:1px solid #f85149;border-radius:8px;padding:12px;margin-bottom:8px;background:rgba(248,81,73,.04)">
              <div style="display:flex;gap:8px;align-items:flex-start">
                <i class="ti ${it.icon}" style="font-size:16px;color:#7d8590;flex-shrink:0;margin-top:2px" aria-hidden="true"></i>
                <div style="flex:1;min-width:0">
                  <div style="font-weight:700;margin-bottom:4px">${esc(it.label)}</div>
                  ${d.descripcion?`<div style="font-size:13px;color:#94a3b8;background:#0a0e14;padding:8px 10px;border-radius:6px;margin-bottom:8px">${esc(d.descripcion)}</div>`:''}
                  ${(d.fotos||[]).length>0?`<div class="ph-gallery">${d.fotos.map(ph=>`<div class="ph-item"><img src="${ph.data}" alt="foto">${ph.caption?`<div style="font-size:11px;color:#7d8590;margin-top:3px">${esc(ph.caption)}</div>`:''}</div>`).join('')}</div>`:''}
                </div>
              </div>
            </div>`).join('')}
        </div>`);
    } else if(reviewed){
      // Zone fully reviewed, no novedades for this tab — compact summary
      lines.push(`
        <div style="display:flex;align-items:center;gap:10px;padding:10px 14px;background:#161b22;border:1px solid rgba(63,185,80,.2);border-radius:8px;margin-bottom:6px">
          <span style="color:#3fb950;font-size:16px">✓</span>
          <span style="font-size:13px;color:#7d8590;flex:1">${esc(zone.label)}</span>
          <span style="font-size:11px;color:#3fb950;font-weight:600">Todo OK · Sin novedades</span>
        </div>`);
    } else {
      // Zone not reviewed yet
      lines.push(`
        <div style="display:flex;align-items:center;gap:10px;padding:10px 14px;background:#161b22;border:1px solid #21262d;border-radius:8px;margin-bottom:6px;opacity:.5">
          <span style="color:#7d8590;font-size:16px">–</span>
          <span style="font-size:13px;color:#7d8590;flex:1">${esc(zone.label)}</span>
          <span style="font-size:11px;color:#7d8590">Pendiente</span>
        </div>`);
    }
  });

  return lines.join('');
}

// ═══════════════════════════════════════════════════════════
// HISTORIAL
// ═══════════════════════════════════════════════════════════
function doHist(cid){S.histConj=S.conjuntos.find(c=>c.id===cid);S.activeConj=S.histConj;goTo('historial');}

function rHist(){
  const c=S.histConj;if(!c)return;
  const recs=S.historial[c.id]||[];
  document.getElementById('v-historial').innerHTML=`
    <div style="padding:20px;max-width:700px;width:100%;margin:0 auto;padding-bottom:40px">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px">
        <button class="btn btng" style="padding:8px 10px" id="hist-back">${ico('ti-arrow-left')}</button>
        <div><div class="lbl">Historial</div><div style="font-size:17px;font-weight:700">${esc(c.nombre)}</div></div>
      </div>
      ${recs.length===0?`<div class="empty">${ico('ti-clipboard')} Sin recorridos guardados aún</div>`
        :recs.map(rec=>{const p=recProg(rec);return`<div class="card" style="margin-bottom:10px">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px">
            <div>
              <div style="font-weight:700;margin-bottom:2px">${fmtD(rec.fecha)}</div>
              <div style="font-size:12px;color:#7d8590">Inspector: ${esc(rec.inspector||'—')}</div>
            </div>
            <div style="text-align:right">
              <div style="font-size:18px;font-weight:800;color:#3fb950">${p.pct}%</div>
              ${p.nov>0?`<div style="font-size:11px;color:#f85149">${ico('ti-alert-triangle')} ${p.nov} novedades</div>`:''}
            </div>
          </div>
          <button class="btn btng btnf" style="font-size:13px" data-rec="${rec.id}">Ver reporte ${ico('ti-arrow-right')}</button>
        </div>`;}).join('')}
    </div>`;

  document.getElementById('hist-back').onclick=()=>goTo('home');
  document.getElementById('v-historial').addEventListener('click',e=>{
    const btn=e.target.closest('[data-rec]');
    if(btn){
      const rec=(S.historial[S.histConj?.id]||[]).find(r=>r.id===btn.dataset.rec);
      if(rec){S.reporteRec=rec;S.repGroup='';goTo('reporte');}
    }
  });
}

// ═══════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════
async function init(){
  await openDB();
  S.conjuntos=await dbAll('conjuntos');
  const all=await dbAll('recorridos');
  all.sort((a,b)=>b.fecha.localeCompare(a.fecha));
  all.forEach(rec=>{
    if(!rec.doneAt){
      // Recorrido en progreso — restaurar para continuar
      if(!S.inProgress)S.inProgress=rec;
      return;
    }
    if(!S.historial[rec.conjuntoId])S.historial[rec.conjuntoId]=[];
    if(S.historial[rec.conjuntoId].length<10)S.historial[rec.conjuntoId].push(rec);
  });
  // Global photo input handler
  document.getElementById('ph-file-input').addEventListener('change',e=>{
    const file=e.target.files?.[0];if(!file)return;
    const ctx=e.target.dataset.ctx;if(!ctx)return;
    const reader=new FileReader();
    reader.onload=ev=>{handlePhotoAction('add',ctx,-1,ev.target.result);};
    reader.readAsDataURL(file);
    e.target.value='';
  });
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
  // Si hay recorrido en progreso, ofrecer continuar
  if(S.inProgress){
    const c=S.conjuntos.find(x=>x.id===S.inProgress.conjuntoId);
    if(c&&confirm(`Tienes un recorrido en progreso de "${S.inProgress.conjuntoNombre}" (${fmtD(S.inProgress.fecha)}). ¿Deseas continuar?`)){
      S.activeConj=c;S.recorrido=S.inProgress;
      S.selZone=S.recorrido.zones[0]?.id;
      S.openGroups=new Set([S.recorrido.zones[0]?.group]);
      _sbBound=false;_bodyBound=false;
      goTo('recorrido');return;
    } else {
      // Descartar recorrido en progreso
      await dbDel('recorridos',S.inProgress.id);
      S.inProgress=null;
    }
  }
  goTo('home');
}
init();
</script>
